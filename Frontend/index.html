<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>
<script>
  (function(){
    var theme = localStorage.getItem('videoteca-theme');
    if(theme) document.documentElement.setAttribute('data-theme', theme);
  })();
</script>
<link rel="stylesheet" href="styles.css?v=6">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', 'Segoe UI', Arial, sans-serif; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Poppins', 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(115deg, rgba(var(--wash-1-rgb),1) 0%, rgba(var(--wash-1-rgb),1) 48%, rgba(var(--wash-2-rgb),1) 52%, rgba(var(--wash-2-rgb),1) 100%);
    position: relative;
    overflow: hidden;
  }

  /* soft cinematic grain / vignette overlay */
  body::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 40%, rgba(0,0,0,0.45) 100%);
    z-index: 1;
    pointer-events: none;
  }

  /* Login card */
  .login-card {
    position: relative;
    z-index: 10;
    width: 420px;
    max-width: 90vw;
    padding: 45px 40px 35px;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.35);
    border-radius: 12px;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    box-shadow: 0 0 50px rgba(0, 0, 0, 0.35);
  }

  .login-card h1 {
    text-align: center;
    color: #fff;
    font-size: 34px;
    font-weight: 700;
    margin-bottom: 30px;
    text-shadow: 0 0 20px rgba(0, 0, 0, 0.4);
  }

  .input-group {
    position: relative;
    margin-bottom: 22px;
  }

  .input-group input {
    width: 100%;
    padding: 14px 45px 14px 20px;
    background: rgba(255, 255, 255, 0.08);
    border: 1.5px solid rgba(255, 255, 255, 0.6);
    border-radius: 30px;
    color: #fff;
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s ease, background 0.2s ease;
  }

  .input-group input::placeholder {
    color: rgba(255, 255, 255, 0.85);
  }

  .input-group input:focus {
    border-color: #fff;
    background: rgba(255, 255, 255, 0.14);
  }

  .input-group .icon {
    position: absolute;
    right: 18px;
    top: 50%;
    transform: translateY(-50%);
    color: #fff;
    width: 18px;
    height: 18px;
    pointer-events: none;
  }

  .options-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 22px;
    font-size: 13.5px;
    color: #fff;
  }

  .remember-me {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .remember-me input[type="checkbox"] {
    width: 15px;
    height: 15px;
    accent-color: #fff;
    cursor: pointer;
  }

  .options-row a {
    color: #fff;
    text-decoration: none;
  }

  .options-row a:hover {
    text-decoration: underline;
  }

  .login-btn {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 30px;
    background: #fff;
    color: #12262b;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    margin-bottom: 18px;
  }

  .form-error {
    background: rgba(var(--crimson-rgb), 0.25);
    border: 1px solid rgba(255, 255, 255, 0.4);
    color: #fff;
    font-size: 13px;
    text-align: center;
    padding: 10px 14px;
    border-radius: 10px;
    margin-bottom: 18px;
    display: none;
  }

  .form-error.show { display: block; }

  .auth-view { display: none; }
  .auth-view.active { display: block; }

  .login-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
  }

  .register-text {
    text-align: center;
    color: #fff;
    font-size: 14px;
  }

  .register-text a {
    color: #fff;
    font-weight: 700;
    text-decoration: none;
  }

  .register-text a:hover {
    text-decoration: underline;
  }

  @media (max-width: 480px) {
    .login-card {
      padding: 35px 25px 25px;
    }
    .login-card h1 {
      font-size: 28px;
    }
  }
</style>
</head>
<body>

  <!-- LOGIN -->
  <form class="login-card auth-view active" id="loginView">
    <h1>Login</h1>

    <div class="form-error" id="loginError"></div>

    <div class="input-group">
      <input type="text" id="loginUsername" placeholder="Username o email" required>
      <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.7 0 4.9-2.2 4.9-4.9S14.7 2.2 12 2.2 7.1 4.4 7.1 7.1 9.3 12 12 12zm0 2.5c-3.3 0-9.8 1.6-9.8 4.9v2.4h19.6v-2.4c0-3.3-6.5-4.9-9.8-4.9z"/></svg>
    </div>

    <div class="input-group">
      <input type="password" id="loginPassword" placeholder="Password" required>
      <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M17 8h-1V6c0-2.2-1.8-4-4-4S8 3.8 8 6v2H7c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM10 6c0-1.1.9-2 2-2s2 .9 2 2v2h-4V6zm2 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/></svg>
    </div>

    <div class="options-row">
      <label class="remember-me">
        <input type="checkbox" id="loginRemember" checked>
        Remember me
      </label>
      <a href="#" id="forgotLink">Forgot password?</a>
    </div>

    <button type="submit" class="login-btn">Login</button>

    <div class="register-text">
      Don't have an account? <a href="#" id="goToRegister">Register</a>
    </div>
  </form>

  <!-- REGISTER -->
  <form class="login-card auth-view" id="registerView">
    <h1>Register</h1>

    <div class="form-error" id="registerError"></div>

    <div class="input-group">
      <input type="text" id="registerUsername" placeholder="Username" required>
      <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.7 0 4.9-2.2 4.9-4.9S14.7 2.2 12 2.2 7.1 4.4 7.1 7.1 9.3 12 12 12zm0 2.5c-3.3 0-9.8 1.6-9.8 4.9v2.4h19.6v-2.4c0-3.3-6.5-4.9-9.8-4.9z"/></svg>
    </div>

    <div class="input-group">
      <input type="email" id="registerEmail" placeholder="Email" required>
      <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"/></svg>
    </div>

    <div class="input-group">
      <input type="password" id="registerPassword" placeholder="Password" required>
      <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M17 8h-1V6c0-2.2-1.8-4-4-4S8 3.8 8 6v2H7c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM10 6c0-1.1.9-2 2-2s2 .9 2 2v2h-4V6zm2 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/></svg>
    </div>

    <div class="input-group">
      <input type="password" id="registerPasswordConfirm" placeholder="Conferma password" required>
      <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M17 8h-1V6c0-2.2-1.8-4-4-4S8 3.8 8 6v2H7c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM10 6c0-1.1.9-2 2-2s2 .9 2 2v2h-4V6zm2 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/></svg>
    </div>

    <button type="submit" class="login-btn">Register</button>

    <div class="register-text">
      Hai già un account? <a href="#" id="goToLogin">Login</a>
    </div>
  </form>

  <div class="overlay" id="forgotOverlay" style="display:none;">
    <div class="modal">
      <h2>Password dimenticata</h2>
      <p style="margin-bottom:16px; font-size:14px; color:var(--muted);">Inserisci il tuo username o la tua email: se l'account esiste, ti mandiamo un link per reimpostare la password.</p>
      <div class="form-error" id="forgotError"></div>
      <div class="form-success" id="forgotSuccess"></div>
      <div class="field">
        <label>Username o email</label>
        <input type="text" id="forgotIdentifier" placeholder="Username o email">
      </div>
      <div class="modal-actions">
        <button class="btn ghost" id="forgotCancel">Chiudi</button>
        <button class="btn primary" id="forgotSubmit">Invia link</button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const TOKEN_KEY = 'videoteca-token';
      const USERNAME_KEY = 'videoteca-username';

      // ATTENZIONE: sostituisci questo indirizzo con l'URL del tuo server
      // dopo averlo pubblicato su Render (vedi la guida ricevuta in chat).
      const API_BASE = 'https://videoteca-backend.onrender.com/api';

      // Se l'utente ha già un token salvato, salta direttamente alla homepage
      if (localStorage.getItem(TOKEN_KEY) || sessionStorage.getItem(TOKEN_KEY)) {
        window.location.replace('homepage.html');
        return;
      }

      async function apiRequest(path, body) {
        const res = await fetch(API_BASE + path, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        let data = null;
        try { data = await res.json(); } catch (e) { /* risposta vuota */ }
        if (!res.ok) {
          throw new Error((data && data.error) || 'Impossibile contattare il server.');
        }
        return data;
      }

      function setAuth(token, username, remember) {
        if (remember) {
          localStorage.setItem(TOKEN_KEY, token);
          localStorage.setItem(USERNAME_KEY, username);
        } else {
          sessionStorage.setItem(TOKEN_KEY, token);
          sessionStorage.setItem(USERNAME_KEY, username);
        }
      }

      function showError(el, message) {
        el.textContent = message;
        el.classList.add('show');
      }

      function hideError(el) {
        el.classList.remove('show');
      }

      function setLoading(button, loading, label) {
        button.disabled = loading;
        button.textContent = loading ? 'Attendere…' : label;
      }

      const loginView = document.getElementById('loginView');
      const registerView = document.getElementById('registerView');

      document.getElementById('goToRegister').onclick = (e) => {
        e.preventDefault();
        loginView.classList.remove('active');
        registerView.classList.add('active');
      };

      document.getElementById('goToLogin').onclick = (e) => {
        e.preventDefault();
        registerView.classList.remove('active');
        loginView.classList.add('active');
      };

      document.getElementById('forgotLink').onclick = (e) => {
        e.preventDefault();
        hideError(forgotError);
        forgotSuccessEl.classList.remove('show');
        document.getElementById('forgotIdentifier').value = '';
        forgotOverlay.style.display = 'flex';
      };

      const forgotOverlay = document.getElementById('forgotOverlay');
      const forgotError = document.getElementById('forgotError');
      const forgotSuccessEl = document.getElementById('forgotSuccess');

      document.getElementById('forgotCancel').onclick = () => { forgotOverlay.style.display = 'none'; };
      forgotOverlay.onclick = (e) => { if (e.target === forgotOverlay) forgotOverlay.style.display = 'none'; };

      document.getElementById('forgotSubmit').onclick = async () => {
        hideError(forgotError);
        forgotSuccessEl.classList.remove('show');

        const identifier = document.getElementById('forgotIdentifier').value.trim();
        if (!identifier) {
          showError(forgotError, 'Inserisci username o email.');
          return;
        }

        const submitBtn = document.getElementById('forgotSubmit');
        setLoading(submitBtn, true, 'Invia link');
        try {
          const data = await apiRequest('/auth/forgot-password', { identifier });
          forgotSuccessEl.textContent = data.message || "Se l'account esiste, riceverai a breve un'email.";
          forgotSuccessEl.classList.add('show');
          setLoading(submitBtn, false, 'Invia link');
        } catch (err) {
          showError(forgotError, err.message);
          setLoading(submitBtn, false, 'Invia link');
        }
      };

      // ---- Login ----
      const loginError = document.getElementById('loginError');
      loginView.addEventListener('submit', async function (e) {
        e.preventDefault();
        hideError(loginError);

        const username = document.getElementById('loginUsername').value.trim();
        const password = document.getElementById('loginPassword').value;
        const remember = document.getElementById('loginRemember').checked;

        if (!username || !password) {
          showError(loginError, 'Inserisci username e password.');
          return;
        }

        const submitBtn = loginView.querySelector('.login-btn');
        setLoading(submitBtn, true);
        try {
          const data = await apiRequest('/auth/login', { username, password });
          setAuth(data.token, data.username, remember);
          window.location.href = 'welcome.html';
        } catch (err) {
          showError(loginError, err.message);
          setLoading(submitBtn, false, 'Login');
        }
      });

      // ---- Register ----
      const registerError = document.getElementById('registerError');
      registerView.addEventListener('submit', async function (e) {
        e.preventDefault();
        hideError(registerError);

        const username = document.getElementById('registerUsername').value.trim();
        const email = document.getElementById('registerEmail').value.trim().toLowerCase();
        const password = document.getElementById('registerPassword').value;
        const confirm = document.getElementById('registerPasswordConfirm').value;

        if (!username || !email || !password || !confirm) {
          showError(registerError, 'Compila tutti i campi.');
          return;
        }
        const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailPattern.test(email)) {
          showError(registerError, 'Inserisci un indirizzo email valido.');
          return;
        }
        if (password !== confirm) {
          showError(registerError, 'Le password non coincidono.');
          return;
        }

        const submitBtn = registerView.querySelector('.login-btn');
        setLoading(submitBtn, true);
        try {
          const data = await apiRequest('/auth/register', { username, email, password });
          setAuth(data.token, data.username, true);
          window.location.href = 'welcome.html';
        } catch (err) {
          showError(registerError, err.message);
          setLoading(submitBtn, false, 'Register');
        }
      });
    })();
  </script>

</body>
</html>
