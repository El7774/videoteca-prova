<title>Videoteca — la mia collezione</title>
<script>
  // Guardia di accesso: senza un token salvato si torna al login
  if (!localStorage.getItem('videoteca-token') && !sessionStorage.getItem('videoteca-token')) {
    window.location.replace('index.html');
  }
  // Applica il tema scelto dall'utente (letto localmente per evitare lo sfarfallio iniziale)
  (function(){
    var theme = localStorage.getItem('videoteca-theme');
    if(theme) document.documentElement.setAttribute('data-theme', theme);
  })();
</script>

<script src="app.js"></script>
<script src="config.js"></script>
<script>
(function(){
  let shows = [];
  let mediaFilter = 'all';
  const seasonEpisodeNamesCache = new Map(); // 'tvId:season' -> Promise<{[episodeNumber]: {name, stillUrl, runtime}}>

  function getSeasonEpisodeNames(tvId, season){
    const key = tvId + ':' + season;
    if(seasonEpisodeNamesCache.has(key)) return seasonEpisodeNamesCache.get(key);
    const promise = apiFetch('/catalog/episodes?tvId=' + encodeURIComponent(tvId) + '&season=' + season)
      .then(list => {
        const map = {};
        (list || []).forEach(e => { if(e && e.episodeNumber) map[e.episodeNumber] = e; });
        return map;
      })
      .catch(() => {
        seasonEpisodeNamesCache.delete(key); // fallita: non tenere in cache un fallimento, riprova al prossimo render
        return null;
      });
    seasonEpisodeNamesCache.set(key, promise);
    return promise;
  }

  // Per i titoli aggiunti prima che salvassimo il tmdbId, lo recupera cercando
  // il titolo su TMDB e lo salva sulla scheda per non doverlo rifare in futuro.
  const tmdbIdResolveCache = new Map(); // 'tipo:titolo' -> Promise<tmdbId|null>, evita ricerche duplicate in parallelo
  async function resolveTmdbId(show){
    if(show.tmdbId) return show.tmdbId;
    const wantedType = show.type === 'film' ? 'movie' : 'tv';
    const key = wantedType + ':' + show.title.trim().toLowerCase();
    if(tmdbIdResolveCache.has(key)) return tmdbIdResolveCache.get(key);

    const promise = apiFetch('/catalog/search?query=' + encodeURIComponent(show.title))
      .then(results => {
        const matches = (results || []).filter(r => r.mediaType === wantedType);
        if(matches.length === 0) return null;
        const target = show.title.trim().toLowerCase();
        const exact = matches.find(r => r.title.trim().toLowerCase() === target);
        const chosen = exact || matches[0];
        show.tmdbId = chosen.tmdbId;
        saveShows();
        return chosen.tmdbId;
      })
      .catch(() => {
        tmdbIdResolveCache.delete(key);
        return null;
      });
    tmdbIdResolveCache.set(key, promise);
    return promise;
  }

  // ---- "Del momento" (serie TV e film di tendenza da TMDB, non legati alla collezione) ----
  const trendingCache = {}; // 'tv'|'movie' -> Promise<risultati|null>, una sola richiesta per sessione

  function fetchTrending(type){
    if(trendingCache[type]) return trendingCache[type];
    const promise = apiFetch('/catalog/trending?type=' + type)
      .catch((err) => {
        console.error('Errore nel caricamento dei contenuti di tendenza (' + type + '): [' + (err && err.status) + '] ' + (err && err.message));
        delete trendingCache[type]; // fallita: riprova al prossimo render invece di restare bloccati su null
        return null;
      });
    trendingCache[type] = promise;
    return promise;
  }

  // Un titolo "del momento" è già nello scaffale se c'è uno show con lo stesso tmdbId e lo stesso tipo.
  function isInShelf(item){
    const wantedType = item.mediaType === 'movie' ? 'film' : 'serie';
    return shows.some(s => s.tmdbId === item.tmdbId && s.type === wantedType);
  }

  function applyAddButtonState(btn, added){
    btn.textContent = added ? '✓' : '+';
  }

  function buildTrendingCard(item){
    const card = document.createElement('div');
    card.className = 'trending-card';
    card.style.cursor = 'pointer';
    card.innerHTML = `
      <div class="trending-poster">
        ${item.posterUrl ? `<img src="${item.posterUrl}" alt="" loading="lazy">` : '🎬'}
        <button type="button" class="trending-add" data-action="add" title="Aggiungi allo scaffale">+</button>
      </div>
      ${item.rating ? `<span class="trending-rating">★ ${item.rating}</span>` : ''}
      <div class="trending-title">${escapeHtml(item.title)}${item.year ? ` <span class="trending-year">(${escapeHtml(item.year)})</span>` : ''}</div>
    `;
    card.onclick = () => { window.location.href = 'details.html?type=' + item.mediaType + '&id=' + item.tmdbId; };
    const addBtn = card.querySelector('.trending-add');
    applyAddButtonState(addBtn, isInShelf(item));
    addBtn.onclick = (e) => {
      e.stopPropagation();
      addFromTrending(item, addBtn);
    };
    return card;
  }

  async function addFromTrending(item, addBtn){
    if(addBtn.dataset.busy === '1') return; // evita doppio clic mentre una richiesta è già in corso

    // Se il titolo è già nello scaffale, un secondo clic sullo stesso tasto lo rimuove.
    if(isInShelf(item)){
      const wantedType = item.mediaType === 'movie' ? 'film' : 'serie';
      const existing = shows.find(s => s.tmdbId === item.tmdbId && s.type === wantedType);
      if(existing){
        shows = shows.filter(s => s.id !== existing.id);
        saveShows();
        render();
        showNotice(`"${existing.title}" rimosso dallo scaffale.`);
      }
      return;
    }

    addBtn.dataset.busy = '1';
    addBtn.textContent = '…';

    let details;
    try{
      details = await apiFetch('/catalog/details?id=' + item.tmdbId + '&type=' + item.mediaType);
    }catch(e){
      if(e.status === 401){ redirectToLogin(); return; }
      showNotice('Impossibile recuperare i dettagli: ' + e.message);
      addBtn.dataset.busy = '';
      addBtn.textContent = '+';
      return;
    }

    shows.unshift({
      id: uid(),
      title: details.title,
      type: details.type,
      rating: 0,
      favorite: false,
      episodeRuntime: details.episodeRuntime || null,
      posterUrl: details.posterUrl || item.posterUrl || null,
      backdropUrl: details.backdropUrl || null,
      tmdbId: item.tmdbId || null,
      lastModifiedAt: Date.now(),
      seasons: details.seasons
    });
    saveShows();
    addBtn.dataset.busy = '';
    render();

    showNotice('"' + details.title + '" aggiunto alla videoteca.');
  }

  // ---- "I tuoi film" (i film già nello scaffale, con la stessa card di "Film del momento") ----
  const movieStatsCache = new Map(); // movieId -> Promise<{voteAverage}|null>

  function fetchMovieStats(movieId){
    if(movieStatsCache.has(movieId)) return movieStatsCache.get(movieId);
    const promise = apiFetch('/catalog/movie-stats?movieId=' + encodeURIComponent(movieId))
      .catch(() => {
        movieStatsCache.delete(movieId); // fallita: riprova al prossimo render
        return null;
      });
    movieStatsCache.set(movieId, promise);
    return promise;
  }

  function buildMyMovieCard(show){
    const card = document.createElement('div');
    card.className = 'trending-card my-movie-card';
    card.style.cursor = 'pointer';
    card.innerHTML = `
      <button type="button" class="my-movie-remove" data-action="remove" title="Rimuovi dallo scaffale">✕</button>
      <div class="trending-poster">${show.posterUrl ? `<img src="${show.posterUrl}" alt="" loading="lazy">` : '🎬'}</div>
      <div class="trending-title">${escapeHtml(show.title)}</div>
      <div class="my-shelf-stats"></div>
      <div class="my-movie-footer">
        <div class="stars">
          ${[1,2,3,4,5].map(n => `<span class="star ${show.rating >= n ? 'on' : ''}" data-value="${n}">★</span>`).join('')}
        </div>
        <button type="button" class="my-movie-heart ${show.favorite ? 'on' : ''}" data-action="favorite" title="${show.favorite ? 'Rimuovi dai preferiti' : 'Aggiungi ai preferiti'}">${show.favorite ? '♥' : '♡'}</button>
      </div>
    `;

    card.onclick = async () => {
      const movieId = show.tmdbId || await resolveTmdbId(show);
      if(!movieId){ showNotice('Impossibile trovare i dettagli di questo titolo.'); return; }
      window.location.href = 'details.html?type=movie&id=' + movieId;
    };

    card.querySelectorAll('.star').forEach(starEl => {
      starEl.onclick = (e) => {
        e.stopPropagation();
        const value = parseInt(starEl.dataset.value, 10);
        show.rating = (show.rating === value) ? 0 : value; // clic sulla stessa stella già selezionata azzera il voto
        touchShow(show);
        saveShows(); render();
      };
    });

    card.querySelector('.my-movie-heart').onclick = (e) => {
      e.stopPropagation();
      show.favorite = !show.favorite;
      touchShow(show);
      saveShows(); render();
    };

    card.querySelector('.my-movie-remove').onclick = async (e) => {
      e.stopPropagation();
      if(!(await showConfirm(`Rimuovere "${show.title}" dallo scaffale?`))) return;
      shows = shows.filter(s => s.id !== show.id);
      saveShows();
      render();
      showNotice(`"${show.title}" rimosso dallo scaffale.`);
    };

    // Voto medio TMDB (su 10), convertito su scala 5 stelle come richiesto.
    // Recuperato in background: se manca il tmdbId (film aggiunto prima di questa funzione),
    // prova prima a recuperarlo cercando il titolo.
    const statsEl = card.querySelector('.my-shelf-stats');
    resolveTmdbId(show).then(movieId => {
      if(!movieId) return;
      return fetchMovieStats(movieId).then(stats => {
        if(!stats || !stats.voteAverage) return;
        const outOfFive = Math.round((stats.voteAverage / 2) * 10) / 10;
        statsEl.textContent = '★ ' + outOfFive + '/5 TMDB';
      });
    });

    return card;
  }

  function renderMyMovies(){
    const section = document.getElementById('myMoviesSection');
    const carousel = document.getElementById('myMoviesCarousel');

    if(mediaFilter !== 'film'){
      section.style.display = 'none';
      return;
    }

    const movies = shows.filter(s => s.type === 'film');
    if(movies.length === 0){
      section.style.display = 'none';
      return;
    }

    section.style.display = 'block';
    carousel.innerHTML = '';
    movies.forEach(show => carousel.appendChild(buildMyMovieCard(show)));
  }

  // ---- "Le tue serie" (stessa card interattiva di "I tuoi film", più le statistiche TMDB della serie) ----
  const tvStatsCache = new Map(); // tvId -> Promise<{voteAverage, status, numberOfSeasons, numberOfEpisodes}|null>

  function fetchTvStats(tvId){
    if(tvStatsCache.has(tvId)) return tvStatsCache.get(tvId);
    const promise = apiFetch('/catalog/tv-stats?tvId=' + encodeURIComponent(tvId))
      .catch(() => {
        tvStatsCache.delete(tvId); // fallita: riprova al prossimo render
        return null;
      });
    tvStatsCache.set(tvId, promise);
    return promise;
  }

  function buildMySeriesCard(show){
    const card = document.createElement('div');
    card.className = 'trending-card my-movie-card';
    card.style.cursor = 'pointer';
    card.innerHTML = `
      <button type="button" class="my-movie-remove" data-action="remove" title="Rimuovi dallo scaffale">✕</button>
      <div class="trending-poster">${show.posterUrl ? `<img src="${show.posterUrl}" alt="" loading="lazy">` : '🎬'}</div>
      <div class="trending-title">${escapeHtml(show.title)}</div>
      <div class="my-shelf-stats"></div>
      <div class="my-movie-footer">
        <div class="stars">
          ${[1,2,3,4,5].map(n => `<span class="star ${show.rating >= n ? 'on' : ''}" data-value="${n}">★</span>`).join('')}
        </div>
        <button type="button" class="my-movie-heart ${show.favorite ? 'on' : ''}" data-action="favorite" title="${show.favorite ? 'Rimuovi dai preferiti' : 'Aggiungi ai preferiti'}">${show.favorite ? '♥' : '♡'}</button>
      </div>
    `;

    card.onclick = async () => {
      const tvId = show.tmdbId || await resolveTmdbId(show);
      if(!tvId){ showNotice('Impossibile trovare i dettagli di questo titolo.'); return; }
      window.location.href = 'details.html?type=tv&id=' + tvId;
    };

    card.querySelectorAll('.star').forEach(starEl => {
      starEl.onclick = (e) => {
        e.stopPropagation();
        const value = parseInt(starEl.dataset.value, 10);
        show.rating = (show.rating === value) ? 0 : value;
        touchShow(show);
        saveShows(); render();
      };
    });

    card.querySelector('.my-movie-heart').onclick = (e) => {
      e.stopPropagation();
      show.favorite = !show.favorite;
      touchShow(show);
      saveShows(); render();
    };

    card.querySelector('.my-movie-remove').onclick = async (e) => {
      e.stopPropagation();
      if(!(await showConfirm(`Rimuovere "${show.title}" dallo scaffale?`))) return;
      shows = shows.filter(s => s.id !== show.id);
      saveShows();
      render();
      showNotice(`"${show.title}" rimosso dallo scaffale.`);
    };

    // Statistiche da TMDB (stagioni, stato, voto medio): recuperate in background e
    // inserite appena arrivano, senza bloccare la comparsa della card. Se la serie non
    // ha ancora un tmdbId salvato, prova prima a recuperarlo cercando il titolo.
    const statsEl = card.querySelector('.my-shelf-stats');
    resolveTmdbId(show).then(tvId => {
      if(!tvId) return;
      return fetchTvStats(tvId).then(stats => {
        if(!stats) return;
        const parts = [];
        if(stats.numberOfSeasons) parts.push(stats.numberOfSeasons + (stats.numberOfSeasons === 1 ? ' stagione' : ' stagioni'));
        if(stats.status) parts.push(stats.status);
        if(stats.voteAverage) parts.push('★ ' + stats.voteAverage + ' TMDB');
        if(parts.length) statsEl.textContent = parts.join(' · ');
      });
    });

    return card;
  }

  function renderMySeries(){
    const section = document.getElementById('mySeriesSection');
    const carousel = document.getElementById('mySeriesCarousel');

    if(mediaFilter !== 'serie'){
      section.style.display = 'none';
      return;
    }

    const series = shows.filter(s => s.type === 'serie');
    if(series.length === 0){
      section.style.display = 'none';
      return;
    }

    section.style.display = 'block';
    carousel.innerHTML = '';
    series.forEach(show => carousel.appendChild(buildMySeriesCard(show)));
  }

  const trendingRendered = { tv: false, movie: false }; // già costruito in DOM: non ripetere il fetch/render ad ogni render()
  const trendingCardRefs = { tv: [], movie: [] }; // { item, btn } per ogni card già costruita, per risincronizzare lo stato del "+"

  function renderTrendingType(type, section, carousel){
    if(trendingRendered[type]){
      section.style.display = 'block';
      return;
    }
    fetchTrending(type).then(results => {
      if(!results || results.length === 0){ section.style.display = 'none'; return; }
      trendingRendered[type] = true;
      section.style.display = 'block';
      carousel.innerHTML = '';
      trendingCardRefs[type] = [];
      results.slice(0, 15).forEach(item => {
        const card = buildTrendingCard(item);
        carousel.appendChild(card);
        trendingCardRefs[type].push({ item, btn: card.querySelector('.trending-add') });
      });
    });
  }

  // Riallinea lo stato "+"/"✓" di ogni card già costruita al reale contenuto dello scaffale
  // (chiamata ad ogni render(): copre sia l'aggiunta sia la rimozione di un titolo).
  function syncTrendingAddButtons(){
    trendingCardRefs.tv.forEach(({item, btn}) => applyAddButtonState(btn, isInShelf(item)));
    trendingCardRefs.movie.forEach(({item, btn}) => applyAddButtonState(btn, isInShelf(item)));
  }

  function renderTrending(){
    const tvSection = document.getElementById('trendingTvSection');
    const moviesSection = document.getElementById('trendingMoviesSection');

    if(mediaFilter !== 'all'){
      tvSection.style.display = 'none';
      moviesSection.style.display = 'none';
      return;
    }

    renderTrendingType('tv', tvSection, document.getElementById('trendingTvCarousel'));
    renderTrendingType('movie', moviesSection, document.getElementById('trendingMoviesCarousel'));
    syncTrendingAddButtons();
  }

  // ---- "Generi Popolari" (da TMDB, non legati alla collezione) ----
  // Colore tema per ciascun genere (r,g,b), stesso ID usato dal backend in POPULAR_GENRES.
  const GENRE_TINTS = {
    28: '224,64,45',     // Azione — rosso fuoco
    35: '235,169,42',    // Commedia — giallo/ambra
    18: '58,79,138',     // Dramma — blu notte
    27: '69,32,84',      // Horror — viola scuro
    10749: '214,73,122', // Romantico — rosa
    878: '32,150,178',   // Fantascienza — ciano
    16: '214,111,42',    // Animazione — arancio caldo
    80: '120,30,30',     // Crime — rosso scuro
    14: '58,140,90',     // Fantasy — verde smeraldo
    99: '75,99,101'      // Documentario — grigio-teal
  };

  let genresRendered = false; // già costruito in DOM: non ripetere il fetch/render ad ogni render()
  let genresPromise = null;

  function fetchGenres(){
    if(genresPromise) return genresPromise;
    genresPromise = apiFetch('/catalog/genres')
      .catch(() => {
        genresPromise = null; // fallita: riprova al prossimo render
        return null;
      });
    return genresPromise;
  }

  function buildGenreCard(genre){
    const card = document.createElement('a');
    card.className = 'genre-card';
    card.href = 'genre.html?id=' + encodeURIComponent(genre.id) + '&name=' + encodeURIComponent(genre.name);
    card.style.setProperty('--genre-tint', GENRE_TINTS[genre.id] || '120,120,120');
    if(genre.backdropUrl) card.style.backgroundImage = `url("${genre.backdropUrl}")`;
    card.innerHTML = `<span class="genre-card-name">${escapeHtml(genre.name)}</span>`;
    return card;
  }

  function renderGenres(){
    const section = document.getElementById('genresSection');

    if(mediaFilter !== 'all'){
      section.style.display = 'none';
      return;
    }
    if(genresRendered){
      section.style.display = 'block';
      return;
    }

    fetchGenres().then(genres => {
      if(!genres || genres.length === 0){ section.style.display = 'none'; return; }
      genresRendered = true;
      section.style.display = 'block';
      const carousel = document.getElementById('genresCarousel');
      carousel.innerHTML = '';
      genres.forEach(genre => carousel.appendChild(buildGenreCard(genre)));
    });
  }

  // Popup di conferma personalizzato (al posto del confirm() nativo del browser).
  // Uso: if(!(await showConfirm('Messaggio?'))) return;
  const confirmOverlay = document.getElementById('confirmOverlay');
  const confirmMessageEl = document.getElementById('confirmMessage');
  const confirmYesBtn = document.getElementById('confirmYes');
  const confirmNoBtn = document.getElementById('confirmNo');
  let confirmResolve = null;

  function closeConfirm(result){
    confirmOverlay.style.display = 'none';
    if(confirmResolve){ confirmResolve(result); confirmResolve = null; }
  }
  confirmYesBtn.onclick = () => closeConfirm(true);
  confirmNoBtn.onclick = () => closeConfirm(false);
  confirmOverlay.onclick = (e) => { if(e.target === confirmOverlay) closeConfirm(false); };

  function showConfirm(message){
    confirmMessageEl.textContent = message;
    confirmOverlay.style.display = 'flex';
    return new Promise(resolve => { confirmResolve = resolve; });
  }

  async function loadShows(){
    try{
      const data = await apiFetch('/shows');
      shows = Array.isArray(data) ? data : [];
    }catch(e){
      if(e.status === 401){ redirectToLogin(); return; }
      console.error('Errore nel caricamento della collezione', e);
      shows = [];
      showNotice('Impossibile contattare il server. Riprova più tardi.');
    }
    ensureLastModified();
  }

  function ensureLastModified(){
    const now = Date.now();
    shows.forEach(s => {
      if(!s.lastModifiedAt) s.lastModifiedAt = now;
      if(typeof s.favorite !== 'boolean') s.favorite = false;
    });
  }

  function saveShows(){
    apiFetch('/shows', { method:'PUT', body: JSON.stringify(shows) })
      .catch(e => {
        if(e.status === 401){ redirectToLogin(); return; }
        console.error('Errore nel salvataggio della collezione', e);
        showNotice('Non sono riuscito a salvare i dati sul server.');
      });
  }

  function touchShow(show){
    show.lastModifiedAt = Date.now();
  }

  function hashHue(str){
    let h = 0;
    for(let i=0;i<str.length;i++){ h = str.charCodeAt(i) + ((h<<5)-h); }
    return Math.abs(h) % 360;
  }

  const STATUS_LABELS = {
    planned: 'Da vedere',
    watching: 'In corso',
    completed: 'Completato',
    dropped: 'Abbandonato'
  };

  function computeProgress(show){
    let total = 0, watched = 0;
    show.seasons.forEach(se => {
      total += se.episodeCount;
      watched += se.watched.filter(Boolean).length;
    });
    return {total, watched, pct: total ? Math.round((watched/total)*100) : 0};
  }

  const DROP_THRESHOLD_MS = 30 * 24 * 60 * 60 * 1000; // 30 giorni

  function computeStatus(show){
    const {total, watched} = computeProgress(show);
    if(total === 0 || watched === 0) return 'planned';
    if(watched >= total) return 'completed';
    // stato intermedio: in corso, a meno che non sia inattivo da 30+ giorni
    const last = show.lastModifiedAt || 0;
    if(Date.now() - last > DROP_THRESHOLD_MS) return 'dropped';
    return 'watching';
  }

  // Trova il primo episodio non ancora segnato come visto, per sapere "a che punto" si è rimasti.
  function getNextEpisode(show){
    for(let si = 0; si < show.seasons.length; si++){
      const se = show.seasons[si];
      for(let ei = 0; ei < se.watched.length; ei++){
        if(!se.watched[ei]) return { season: si + 1, episode: ei + 1 };
      }
    }
    return null;
  }

  function filterByMedia(list, media){
    if(media === 'all') return list;
    return list.filter(s => s.type === media);
  }

  function buildFavoriteCard(show){
    const hue = hashHue(show.title);
    const gradient = `linear-gradient(160deg, hsla(${hue},45%,26%,1), hsla(${(hue+40)%360},35%,14%,1))`;

    const card = document.createElement('div');
    card.className = 'fav-card';
    card.style.cursor = 'pointer';

    const badges = [];
    if(show.rating > 0) badges.push(`<span class="fav-rating">★ ${show.rating}/5</span>`);
    if(show.episodeRuntime) badges.push(`<span class="fav-runtime">⏱ ${show.episodeRuntime} min</span>`);

    card.innerHTML = `
      <div class="fav-poster" style="background:${gradient};">
        ${show.posterUrl ? `<img src="${show.posterUrl}" alt="" loading="lazy">` : ''}
        <button class="fav-remove" title="Rimuovi dai preferiti" data-action="unfavorite">♥</button>
      </div>
      ${badges.length ? `<div class="fav-meta">${badges.join('')}</div>` : ''}
      <div class="fav-title">${escapeHtml(show.title)}</div>
    `;

    card.onclick = async () => {
      const wantedType = show.type === 'film' ? 'movie' : 'tv';
      const id = show.tmdbId || await resolveTmdbId(show);
      if(!id){ showNotice('Impossibile trovare i dettagli di questo titolo.'); return; }
      window.location.href = 'details.html?type=' + wantedType + '&id=' + id;
    };

    card.querySelector('[data-action="unfavorite"]').onclick = (e) => {
      e.stopPropagation();
      show.favorite = false;
      touchShow(show);
      saveShows(); render();
    };

    return card;
  }

  // Trova, all'interno della stagione che si sta guardando, gli episodi ancora da vedere
  // dopo quello corrente (fino alla fine della stagione, con un tetto per non allungarsi
  // all'infinito su stagioni molto lunghe).
  function getUpcomingEpisodesInSeason(show, limit){
    const next = getNextEpisode(show);
    if(!next) return { season: null, episodes: [], remaining: 0 };
    const season = show.seasons[next.season - 1];
    const episodeNumbers = [];
    for(let ei = next.episode; ei < season.watched.length; ei++){
      episodeNumbers.push(ei + 1); // il prossimo da vedere (next.episode) è già mostrato nell'hero
    }
    return {
      season: next.season,
      episodes: episodeNumbers.slice(0, limit),
      remaining: Math.max(0, episodeNumbers.length - limit)
    };
  }

  // Mostra in grande la serie "in corso" con il voto più alto (S{n} · E{n} da vedere),
  // di fianco gli episodi successivi della stagione che si sta guardando e, ancora
  // di fianco, la lista compatta delle altre serie in corso.
  function renderNowWatching(){
    const section = document.getElementById('nowWatchingSection');
    const hero = document.getElementById('nowWatchingHero');
    const episodesEl = document.getElementById('nowWatchingEpisodes');
    const items = document.getElementById('nowWatchingItems');

    if(mediaFilter !== 'all'){
      section.style.display = 'none';
      hero.innerHTML = '';
      episodesEl.innerHTML = '';
      items.innerHTML = '';
      return;
    }

    const watching = shows
      .filter(s => s.type === 'serie' && computeStatus(s) === 'watching')
      .sort((a, b) => (b.rating || 0) - (a.rating || 0) || (b.lastModifiedAt || 0) - (a.lastModifiedAt || 0));

    if(watching.length === 0){
      section.style.display = 'none';
      hero.innerHTML = '';
      episodesEl.innerHTML = '';
      items.innerHTML = '';
      return;
    }
    section.style.display = 'flex';

    const [current, ...rest] = watching;
    const {total, watched} = computeProgress(current);
    const next = getNextEpisode(current);

    const heroImage = current.backdropUrl || current.posterUrl;
    hero.style.backgroundImage = heroImage ? `url("${heroImage}")` : 'none';
    hero.innerHTML = `
      <div class="now-watching-hero-content">
        <div class="now-watching-year">In corso</div>
        <h2>${escapeHtml(current.title)}</h2>
        <div class="now-watching-episode-subtitle" id="nowWatchingHeroEpisodeName"></div>
        <div class="now-watching-hero-meta">
          <span class="status-badge watching">${STATUS_LABELS.watching}</span>
          ${next ? `<span class="now-watching-progress">Stagione ${next.season} · Episodio ${next.episode}</span>` : ''}
          <span class="now-watching-progress">${watched}/${total} episodi</span>
          ${current.episodeRuntime ? `<span class="runtime-badge">⏱ ${current.episodeRuntime} min/ep</span>` : ''}
          ${current.rating > 0 ? `<div class="stars">${[1,2,3,4,5].map(n => `<span class="star ${current.rating>=n?'on':''}">★</span>`).join('')}</div>` : ''}
        </div>
      </div>
    `;

    // ---- In corso (le altre serie, di fianco a "Episodi successivi") ----
    if(rest.length === 0){
      items.innerHTML = '<div class="now-watching-empty-side">Nessun\'altra serie in corso al momento.</div>';
    } else {
      items.innerHTML = '';
      rest.slice(0, 4).forEach(show => {
        const {total: t, watched: w} = computeProgress(show);
        const n = getNextEpisode(show);
        const row = document.createElement('div');
        row.className = 'now-watching-item';
        row.innerHTML = `
          <div class="now-watching-item-poster">${show.posterUrl ? `<img src="${show.posterUrl}" alt="" loading="lazy">` : ''}</div>
          <div class="now-watching-item-info">
            <div class="now-watching-item-title">${escapeHtml(show.title)}</div>
            <div class="now-watching-item-progress">${n ? `S${n.season} · E${n.episode}` : ''}${n ? ' · ' : ''}${w}/${t}</div>
          </div>
        `;
        items.appendChild(row);
      });
    }

    // ---- Episodi successivi (della stagione della serie mostrata in grande) ----
    const upcoming = getUpcomingEpisodesInSeason(current, 3);
    const rowRefsByEpisode = {};
    if(!next || upcoming.episodes.length === 0){
      episodesEl.innerHTML = '<div class="now-watching-empty-side">Nessun altro episodio da vedere in questa stagione.</div>';
    } else {
      episodesEl.innerHTML = '';
      upcoming.episodes.forEach(epNumber => {
        const row = document.createElement('div');
        row.className = 'now-watching-episode';
        row.innerHTML = `
          <div class="now-watching-episode-still" aria-hidden="true"></div>
          <div class="now-watching-episode-info">
            <div class="now-watching-episode-top">
              <span class="now-watching-episode-num">E${epNumber}</span>
              <span class="now-watching-episode-label">Episodio ${epNumber}</span>
            </div>
            <span class="now-watching-episode-runtime">${current.episodeRuntime ? current.episodeRuntime + ' min' : ''}</span>
          </div>
        `;
        episodesEl.appendChild(row);
        rowRefsByEpisode[epNumber] = {
          still: row.querySelector('.now-watching-episode-still'),
          label: row.querySelector('.now-watching-episode-label'),
          runtime: row.querySelector('.now-watching-episode-runtime')
        };
      });
      if(upcoming.remaining > 0){
        const more = document.createElement('div');
        more.className = 'now-watching-episode-more';
        more.textContent = `+${upcoming.remaining} altri episodi in questa stagione`;
        episodesEl.appendChild(more);
      }
    }

    // Sostituisce le etichette generiche con nome, durata e immagine di anteprima veri,
    // sia nella preview grande (episodio in corso) sia nella lista "Episodi successivi",
    // appena disponibili da TMDB. Se la serie non ha ancora un tmdbId salvato (aggiunta
    // prima di questa funzione), prova prima a recuperarlo cercando il titolo; se anche
    // questo fallisce, o TMDB non ha il dato, restano le etichette generiche senza rompere nulla.
    if(next){
      resolveTmdbId(current).then(tvId => {
        if(!tvId) return;
        return getSeasonEpisodeNames(tvId, next.season).then(episodesData => {
          if(!episodesData) return;

          const heroEpisode = episodesData[next.episode];
          if(heroEpisode && heroEpisode.name){
            const heroSubtitleEl = document.getElementById('nowWatchingHeroEpisodeName');
            if(heroSubtitleEl) heroSubtitleEl.textContent = heroEpisode.name;
          }

          Object.keys(rowRefsByEpisode).forEach(epNumber => {
            const data = episodesData[epNumber];
            if(!data) return;
            const refs = rowRefsByEpisode[epNumber];
            if(data.name) refs.label.textContent = data.name;
            if(data.stillUrl) refs.still.innerHTML = `<img src="${data.stillUrl}" alt="" loading="lazy">`;
            const runtimeMin = data.runtime || current.episodeRuntime;
            if(runtimeMin) refs.runtime.textContent = runtimeMin + ' min';
          });
        });
      });
    }
  }

  function renderFavorites(){
    const section = document.getElementById('favoritesSection');
    const carousel = document.getElementById('favoritesGrid');
    const countEl = document.getElementById('favoritesCount');
    const favorites = filterByMedia(shows.filter(s => s.favorite), mediaFilter);

    if(favorites.length === 0){
      section.style.display = 'none';
      carousel.innerHTML = '';
      return;
    }

    section.style.display = 'block';
    countEl.textContent = favorites.length;
    carousel.innerHTML = '';
    favorites.forEach(show => carousel.appendChild(buildFavoriteCard(show)));
  }

  function render(){
    renderNowWatching();
    renderFavorites();
    renderMyMovies();
    renderMySeries();
    renderGenres();
    renderTrending();
  }

  // ---------- Ricerca online (TMDB) ----------
  const onlineSearchForm = document.getElementById('onlineSearchForm');
  const onlineSearchInput = document.getElementById('onlineSearchInput');
  const onlineSearchLive = document.getElementById('onlineSearchLive');
  let liveSearchDebounce = null;
  let liveSearchToken = 0;

  function mediaTypeLabel(mediaType){
    return mediaType === 'movie' ? 'Film' : 'Serie TV';
  }

  function closeLiveResults(){
    onlineSearchLive.style.display = 'none';
    onlineSearchLive.innerHTML = '';
  }

  async function fetchCombinedResults(query){
    let tmdbList;
    try{
      tmdbList = await apiFetch('/catalog/search?query=' + encodeURIComponent(query));
    }catch(e){
      if(e.status === 401){ redirectToLogin(); }
      throw e;
    }
    return tmdbList || [];
  }

  function buildResultRow(r){
    const item = document.createElement('div');
    item.className = 'online-search-result';
    item.style.cursor = 'pointer';
    const added = isInShelf(r);
    item.innerHTML = `
      <div class="online-search-poster">${r.posterUrl ? `<img src="${r.posterUrl}" alt="">` : '🎬'}</div>
      <div class="online-search-info">
        <div class="online-search-title">${escapeHtml(r.title)}${r.year ? ' <span class="online-search-year">(' + escapeHtml(r.year) + ')</span>' : ''}</div>
        <span class="type-badge ${r.mediaType === 'movie' ? 'film' : 'serie'}">${mediaTypeLabel(r.mediaType)}</span>
      </div>
      <button type="button" class="btn ${added ? 'ghost' : 'primary'} online-search-add">${added ? '✓ Nella videoteca' : '+ Aggiungi'}</button>
    `;
    item.onclick = () => { window.location.href = 'details.html?type=' + r.mediaType + '&id=' + r.tmdbId; };
    item.querySelector('.online-search-add').onclick = (e) => { e.stopPropagation(); addFromOnlineSearch(r, item); };
    return item;
  }

  // Suggerimenti live mentre si scrive
  onlineSearchInput.addEventListener('input', () => {
    const query = onlineSearchInput.value.trim();
    clearTimeout(liveSearchDebounce);

    if(!query){
      closeLiveResults();
      return;
    }

    liveSearchDebounce = setTimeout(async () => {
      const myToken = ++liveSearchToken;
      onlineSearchLive.style.display = 'block';
      onlineSearchLive.innerHTML = '<div class="online-search-status">Ricerca in corso…</div>';

      let results;
      try{
        results = await fetchCombinedResults(query);
      }catch(e){
        if(myToken !== liveSearchToken) return;
        onlineSearchLive.innerHTML = '<div class="online-search-status">' + escapeHtml(e.message || 'Errore durante la ricerca.') + '</div>';
        return;
      }
      if(myToken !== liveSearchToken) return; // arrivata una ricerca più recente nel frattempo

      if(!results || results.length === 0){
        onlineSearchLive.innerHTML = '<div class="online-search-status">Nessun risultato per "' + escapeHtml(query) + '".</div>';
        return;
      }

      onlineSearchLive.innerHTML = '';
      results.slice(0, 6).forEach(r => onlineSearchLive.appendChild(buildResultRow(r)));

      const seeAll = document.createElement('button');
      seeAll.type = 'button';
      seeAll.className = 'online-search-see-all';
      seeAll.textContent = 'Vedi tutti i risultati per "' + query + '" →';
      seeAll.onclick = () => goToSearchPage(query);
      onlineSearchLive.appendChild(seeAll);
    }, 350);
  });

  function goToSearchPage(query){
    closeLiveResults();
    window.location.href = 'search.html?q=' + encodeURIComponent(query);
  }

  onlineSearchForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const query = onlineSearchInput.value.trim();
    if(!query){ showNotice('Scrivi qualcosa da cercare.'); return; }
    goToSearchPage(query);
  });

  // Chiude la tendina se si clicca fuori
  document.addEventListener('click', (e) => {
    if(!onlineSearchForm.contains(e.target)) closeLiveResults();
  });

  async function addFromOnlineSearch(result, itemEl){
    const addBtn = itemEl.querySelector('.online-search-add');
    if(addBtn.dataset.busy === '1') return;

    // Se il titolo è già nello scaffale, un secondo clic sullo stesso tasto lo rimuove
    // invece di aggiungerlo di nuovo in duplicato.
    if(isInShelf(result)){
      const wantedType = result.mediaType === 'movie' ? 'film' : 'serie';
      const existing = shows.find(s => s.tmdbId === result.tmdbId && s.type === wantedType);
      if(existing){
        shows = shows.filter(s => s.id !== existing.id);
        saveShows();
        render();
        addBtn.className = 'btn primary online-search-add';
        addBtn.textContent = '+ Aggiungi';
        showNotice(`"${existing.title}" rimosso dallo scaffale.`);
      }
      return;
    }

    addBtn.dataset.busy = '1';
    addBtn.disabled = true;
    addBtn.textContent = 'Attendere…';

    const detailsPath = '/catalog/details?id=' + result.tmdbId + '&type=' + result.mediaType;

    let details;
    try{
      details = await apiFetch(detailsPath);
    }catch(e){
      if(e.status === 401){ redirectToLogin(); return; }
      showNotice('Impossibile recuperare i dettagli: ' + e.message);
      addBtn.dataset.busy = '';
      addBtn.disabled = false;
      addBtn.textContent = '+ Aggiungi';
      return;
    }

    shows.unshift({
      id: uid(),
      title: details.title,
      type: details.type,
      rating: 0,
      favorite: false,
      episodeRuntime: details.episodeRuntime || null,
      posterUrl: details.posterUrl || result.posterUrl || null,
      backdropUrl: details.backdropUrl || null,
      tmdbId: result.tmdbId || null,
      lastModifiedAt: Date.now(),
      seasons: details.seasons
    });
    saveShows();
    render();

    showNotice('"' + details.title + '" aggiunto alla videoteca.');
    addBtn.dataset.busy = '';
    addBtn.disabled = false;
    addBtn.className = 'btn ghost online-search-add';
    addBtn.textContent = '✓ Nella videoteca';
  }

  // ---------- Barra di navigazione in alto ----------
  function setActiveNavLink(link){
    document.querySelectorAll('.topnav-link').forEach(a => a.classList.remove('active'));
    link.classList.add('active');
  }

  document.getElementById('navBoard').onclick = (e) => {
    e.preventDefault();
    mediaFilter = 'all'; render();
    setActiveNavLink(e.currentTarget);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };
  document.getElementById('navMovies').onclick = (e) => {
    e.preventDefault();
    mediaFilter = 'film'; render();
    setActiveNavLink(e.currentTarget);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };
  document.getElementById('navSeries').onclick = (e) => {
    e.preventDefault();
    mediaFilter = 'serie'; render();
    setActiveNavLink(e.currentTarget);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };
  document.getElementById('navStats').onclick = (e) => {
    e.preventDefault();
    showNotice('La pagina Statistiche sarà disponibile in futuro.');
  };

  // ---------- Favorites carousel arrows ----------
  document.getElementById('favoritesPrev').onclick = () => {
    document.getElementById('favoritesGrid').scrollBy({ left: -320, behavior: 'smooth' });
  };
  document.getElementById('favoritesNext').onclick = () => {
    document.getElementById('favoritesGrid').scrollBy({ left: 320, behavior: 'smooth' });
  };

  // ---------- Sessione / Logout ----------
  const authUser = getStoredUsername();
  const sessionUserName = document.getElementById('sessionUserName');
  if (sessionUserName) sessionUserName.textContent = authUser || '';

  // ---------- Avatar ----------
  const avatarImg = document.getElementById('avatarImg');
  const avatarInitial = document.getElementById('avatarInitial');
  const avatarInput = document.getElementById('avatarInput');

  function displayAvatar(dataUrl, usernameForInitial){
    if(dataUrl){
      avatarImg.src = dataUrl;
      avatarImg.style.display = 'block';
      avatarInitial.style.display = 'none';
    } else {
      avatarImg.style.display = 'none';
      avatarInitial.style.display = 'flex';
      avatarInitial.textContent = (usernameForInitial || '?').trim().charAt(0).toUpperCase();
    }
  }

  async function loadAccountInfo(){
    try{
      const me = await apiFetch('/me');
      if(me && me.username && sessionUserName) sessionUserName.textContent = me.username;
      displayAvatar(me ? me.avatar : null, me ? me.username : authUser);
    }catch(e){
      if(e.status === 401){ redirectToLogin(); return; }
      displayAvatar(null, authUser);
    }
  }

  if(avatarInput) avatarInput.onchange = () => {
    const file = avatarInput.files && avatarInput.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const size = 160;
        const canvas = document.createElement('canvas');
        canvas.width = size; canvas.height = size;
        const ctx = canvas.getContext('2d');
        const scale = Math.max(size / img.width, size / img.height);
        const w = img.width * scale, h = img.height * scale;
        ctx.drawImage(img, (size - w) / 2, (size - h) / 2, w, h);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
        apiFetch('/me/avatar', { method:'PUT', body: JSON.stringify({ avatar: dataUrl }) })
          .then(() => displayAvatar(dataUrl, authUser))
          .catch(err => showNotice('Non sono riuscito a salvare la foto: ' + err.message));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
    avatarInput.value = '';
  };

  // ---------- Init ----------
  async function init(){
    await loadShows();
    render();
    loadAccountInfo();
  }
  init();
})();
</script>
