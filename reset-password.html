<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reimposta password — Videoteca</title>
<script>
  (function(){
    var theme = localStorage.getItem('videoteca-theme');
    if(theme) document.documentElement.setAttribute('data-theme', theme);
  })();
</script>
<link rel="stylesheet" href="styles.css?v=6">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', 'Segoe UI', Arial, sans-serif; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Poppins', 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(115deg, rgba(var(--wash-1-rgb),1) 0%, rgba(var(--wash-1-rgb),1) 48%, rgba(var(--wash-2-rgb),1) 52%, rgba(var(--wash-2-rgb),1) 100%);
    position: relative;
    overflow: hidden;
  }

  body::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 40%, rgba(0,0,0,0.45) 100%);
    z-index: 1;
    pointer-events: none;
  }

  .login-card {
    position: relative;
    z-index: 10;
    width: 420px;
    max-width: 90vw;
    padding: 45px 40px 35px;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.35);
    border-radius: 12px;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    box-shadow: 0 0 50px rgba(0, 0, 0, 0.35);
  }

  .login-card h1 {
    text-align: center;
    color: #fff;
    font-size: 30px;
    font-weight: 700;
    margin-bottom: 14px;
    text-shadow: 0 0 20px rgba(0, 0, 0, 0.4);
  }

  .login-card .subtitle {
    text-align: center;
    color: rgba(255,255,255,0.85);
    font-size: 13.5px;
    margin-bottom: 26px;
  }

  .input-group {
    position: relative;
    margin-bottom: 22px;
  }

  .input-group input {
    width: 100%;
    padding: 14px 45px 14px 20px;
    background: rgba(255, 255, 255, 0.08);
    border: 1.5px solid rgba(255, 255, 255, 0.6);
    border-radius: 30px;
    color: #fff;
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s ease, background 0.2s ease;
  }

  .input-group input::placeholder { color: rgba(255, 255, 255, 0.85); }
  .input-group input:focus { border-color: #fff; background: rgba(255, 255, 255, 0.14); }

  .input-group .icon {
    position: absolute;
    right: 18px;
    top: 50%;
    transform: translateY(-50%);
    color: #fff;
    width: 18px;
    height: 18px;
    pointer-events: none;
  }

  .login-btn {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 30px;
    background: #fff;
    color: #12262b;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    margin-bottom: 10px;
  }
  .login-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25); }
  .login-btn:disabled { opacity: 0.7; cursor: default; transform:none; box-shadow:none; }

  .form-error {
    background: rgba(var(--crimson-rgb), 0.25);
    border: 1px solid rgba(255, 255, 255, 0.4);
    color: #fff;
    font-size: 13px;
    text-align: center;
    padding: 10px 14px;
    border-radius: 10px;
    margin-bottom: 18px;
    display: none;
  }
  .form-error.show { display: block; }

  .form-success {
    background: rgba(var(--teal-rgb), 0.25);
    border: 1px solid rgba(255, 255, 255, 0.4);
    color: #fff;
    font-size: 13px;
    text-align: center;
    padding: 10px 14px;
    border-radius: 10px;
    margin-bottom: 18px;
    display: none;
  }
  .form-success.show { display: block; }

  .back-link {
    display: block;
    text-align: center;
    color: #fff;
    font-size: 14px;
    text-decoration: none;
    margin-top: 6px;
  }
  .back-link:hover { text-decoration: underline; }

  @media (max-width: 480px) {
    .login-card { padding: 35px 25px 25px; }
    .login-card h1 { font-size: 26px; }
  }
</style>
</head>
<body>

  <form class="login-card" id="resetForm">
    <h1>Nuova password</h1>
    <p class="subtitle" id="subtitle">Scegli una nuova password per il tuo account.</p>

    <div class="form-error" id="resetError"></div>
    <div class="form-success" id="resetSuccess"></div>

    <div class="input-group">
      <input type="password" id="newPassword" placeholder="Nuova password" required>
      <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M17 8h-1V6c0-2.2-1.8-4-4-4S8 3.8 8 6v2H7c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM10 6c0-1.1.9-2 2-2s2 .9 2 2v2h-4V6zm2 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/></svg>
    </div>

    <div class="input-group">
      <input type="password" id="newPasswordConfirm" placeholder="Conferma nuova password" required>
      <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M17 8h-1V6c0-2.2-1.8-4-4-4S8 3.8 8 6v2H7c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM10 6c0-1.1.9-2 2-2s2 .9 2 2v2h-4V6zm2 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/></svg>
    </div>

    <button type="submit" class="login-btn" id="resetSubmit">Salva nuova password</button>

    <a href="index.html" class="back-link">← Torna al login</a>
  </form>

  <script>
    (function () {
      // ATTENZIONE: sostituisci questo indirizzo con l'URL del tuo server
      // dopo averlo pubblicato su Render (vedi la guida ricevuta in chat).
      const API_BASE = 'https://videoteca-backend.onrender.com/api';

      const params = new URLSearchParams(window.location.search);
      const token = params.get('token');

      const form = document.getElementById('resetForm');
      const errorEl = document.getElementById('resetError');
      const successEl = document.getElementById('resetSuccess');
      const submitBtn = document.getElementById('resetSubmit');

      function showError(message) {
        errorEl.textContent = message;
        errorEl.classList.add('show');
      }
      function hideError() { errorEl.classList.remove('show'); }

      if (!token) {
        document.getElementById('subtitle').textContent = 'Link non valido: manca il codice di reset.';
        showError('Richiedi un nuovo link dalla pagina di login.');
        form.querySelectorAll('.input-group, .login-btn').forEach(el => el.style.display = 'none');
        return;
      }

      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        hideError();
        successEl.classList.remove('show');

        const newPassword = document.getElementById('newPassword').value;
        const confirm = document.getElementById('newPasswordConfirm').value;

        if (!newPassword || !confirm) {
          showError('Compila entrambi i campi.');
          return;
        }
        if (newPassword.length < 6) {
          showError('La password deve avere almeno 6 caratteri.');
          return;
        }
        if (newPassword !== confirm) {
          showError('Le password non coincidono.');
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Attendere…';
        try {
          const res = await fetch(API_BASE + '/auth/reset-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token, newPassword })
          });
          let data = null;
          try { data = await res.json(); } catch (e) { /* risposta vuota */ }
          if (!res.ok) {
            throw new Error((data && data.error) || 'Impossibile reimpostare la password.');
          }

          successEl.textContent = 'Password aggiornata! Ora puoi accedere con la nuova password.';
          successEl.classList.add('show');
          form.querySelectorAll('.input-group, .login-btn').forEach(el => el.style.display = 'none');
        } catch (err) {
          showError(err.message);
          submitBtn.disabled = false;
          submitBtn.textContent = 'Salva nuova password';
        }
      });
    })();
  </script>

</body>
</html>
