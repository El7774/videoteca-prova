<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dettagli — Videoteca</title>
<script>
  if (!localStorage.getItem('videoteca-token') && !sessionStorage.getItem('videoteca-token')) {
    window.location.replace('index.html');
  }
  (function(){
    var theme = localStorage.getItem('videoteca-theme');
    if(theme) document.documentElement.setAttribute('data-theme', theme);
  })();
</script>
<link rel="stylesheet" href="styles.css?v=6">
<style>
  .details-page-header{ display:flex; align-items:center; gap:14px; margin-bottom:20px; }

  /* Hero: preview grande + dettagli */
  .details-layout{ display:flex; gap:32px; align-items:flex-start; margin-bottom:32px; flex-wrap:wrap; }
  .details-preview-card{
    flex:0 0 360px; width:360px; max-width:100%;
    aspect-ratio:2/3; min-height:420px;
    border-radius:calc(var(--radius) + 6px); overflow:hidden;
    border:1px solid var(--line); background-color:var(--panel-raised);
    background-size:cover; background-position:center;
    box-shadow:0 10px 30px rgba(0,0,0,0.35);
  }
  @media(max-width:760px){
    .details-layout{ gap:22px; }
    .details-preview-card{ flex-basis:100%; width:100%; min-height:360px; aspect-ratio:16/10; }
  }
  .details-info{ flex:1 1 420px; min-width:280px; padding-top:6px; }
  .details-info h1{ font-family:'Bebas Neue',sans-serif; font-size:42px; letter-spacing:0.5px; color:var(--text); margin:0 0 14px; line-height:0.95; }
  @media(max-width:560px){ .details-info h1{ font-size:32px; } }
  .details-meta-row{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
  .details-genres{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px; }
  .details-genre-chip{ font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--muted); background:var(--panel-raised); border:1px solid var(--line); border-radius:999px; padding:4px 11px; }
  .details-overview{ color:var(--muted); font-family:'Inter',sans-serif; font-size:14px; line-height:1.65; max-width:720px; margin-bottom:18px; }
  .details-add-btn{ font-family:'JetBrains Mono',monospace; font-size:13px; font-weight:700; padding:10px 22px; border-radius:999px; border:none; cursor:pointer; background:var(--orange); color:#FCEFE6; transition:filter 0.15s, background 0.15s; }
  .details-add-btn:hover{ filter:brightness(1.08); }
  .details-add-btn.added{ background:var(--teal); }
  .details-empty{ color:var(--muted); font-family:'JetBrains Mono',monospace; font-size:13px; }

  /* Statistiche/community */
  .details-stats{ background:var(--panel); border:1px solid var(--line); border-radius:calc(var(--radius)+6px); padding:20px 20px 16px; margin-bottom:32px; backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); }
  .details-stats-head{ display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; margin-bottom:16px; }
  .details-stats-head h2{ font-family:'Inter',sans-serif; font-weight:800; font-size:15px; letter-spacing:-0.2px; color:var(--text); margin:0; display:flex; align-items:center; gap:8px; }
  .details-stats-head h2 span{ font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:400; color:var(--muted); border:1px solid var(--line); background:var(--panel-raised); border-radius:999px; padding:4px 10px; }
  .details-stat-pills{ display:flex; gap:8px; flex-wrap:wrap; }
  .details-stat-pill{ font-family:'JetBrains Mono',monospace; font-size:12px; padding:6px 12px; border-radius:999px; border:1px solid var(--line); background:var(--panel-raised); display:inline-flex; align-items:center; gap:7px; color:var(--muted); }
  .details-stat-pill strong{ color:var(--text); font-weight:700; }
  .details-stat-pill.likes strong{ color:var(--crimson); }
  .details-stat-pill.comments strong{ color:var(--teal); }
  .details-chart-wrap{ background:var(--panel-raised); border:1px solid var(--line); border-radius:10px; padding:16px 12px 8px; overflow-x:auto; scrollbar-width:thin; scrollbar-color:var(--orange-dim) transparent; }
  .details-chart-wrap::-webkit-scrollbar{ height:6px; }
  .details-chart-wrap::-webkit-scrollbar-thumb{ background:var(--orange-dim); border-radius:999px; }
  .details-chart-svg{ display:block; width:100%; min-width:560px; height:200px; }
  .details-chart-empty{ text-align:center; color:var(--muted); font-family:'JetBrains Mono',monospace; font-size:12px; padding:22px 10px; }
  .details-chart-legend{ display:flex; gap:14px; justify-content:center; margin-top:10px; font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--muted); }
  .details-chart-legend span{ display:inline-flex; align-items:center; gap:6px; }
  .details-chart-legend i{ width:10px; height:10px; border-radius:3px; display:inline-block; }

  /* Stagioni / episodi — nuova disposizione */
  .details-seasons{ margin-bottom:32px; }
  .details-seasons-head{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:14px; }
  .details-seasons-head h2{ font-family:'Inter',sans-serif; font-weight:800; font-size:18px; color:var(--text); margin:0; }
  .details-seasons-head small{ font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--muted); }
  .details-season-layout{ display:flex; gap:20px; align-items:flex-start; }
  @media(max-width:860px){ .details-season-layout{ flex-direction:column; } }
  .details-season-nav{
    flex:0 0 180px; display:flex; flex-direction:column; gap:8px;
    position:sticky; top:18px; max-height:62vh; overflow-y:auto; padding-right:6px;
    scrollbar-width:thin; scrollbar-color:var(--orange-dim) transparent;
  }
  .details-season-nav::-webkit-scrollbar{ width:6px; }
  .details-season-nav::-webkit-scrollbar-thumb{ background:var(--orange-dim); border-radius:999px; }
  @media(max-width:860px){
    .details-season-nav{ flex:0 0 auto; position:static; max-height:none; flex-direction:row; overflow-x:auto; overflow-y:hidden; padding-bottom:8px; scrollbar-width:thin; }
    .details-season-nav::-webkit-scrollbar{ height:6px; }
  }
  .details-season-tab{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:12px 14px; border-radius:10px; border:1px solid var(--line); background:var(--panel);
    font-family:'JetBrains Mono',monospace; font-weight:700; font-size:13px; color:var(--text);
    cursor:pointer; text-align:left; white-space:nowrap; transition:border-color 0.15s, background 0.15s, color 0.15s;
  }
  .details-season-tab small{ font-weight:500; font-size:11px; color:var(--muted); }
  .details-season-tab:hover{ border-color:var(--orange-dim); color:var(--orange); }
  .details-season-tab.active{ background:var(--orange); border-color:var(--orange); color:#FCEFE6; }
  .details-season-tab.active small{ color:rgba(252,239,230,0.9); }

  .details-episodes-wrap{ flex:1 1 auto; min-width:0; }
  .details-episodes-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:14px; }
  @media(max-width:600px){ .details-episodes-grid{ grid-template-columns:1fr; } }
  .details-episode-card{
    border:1px solid var(--line); border-radius:10px; background:var(--panel); overflow:hidden;
    display:flex; flex-direction:column; cursor:pointer; transition:border-color 0.15s, transform 0.15s, box-shadow 0.15s;
  }
  .details-episode-card:hover{ border-color:var(--orange-dim); transform:translateY(-2px); }
  .details-episode-card.active{ border-color:var(--orange); box-shadow:0 0 0 1px var(--orange); }
  .details-episode-still{ width:100%; aspect-ratio:16/9; background:var(--panel-raised); position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center; font-size:28px; color:var(--muted); }
  .details-episode-still img{ width:100%; height:100%; object-fit:cover; display:block; }
  .details-episode-badge{ position:absolute; top:8px; left:8px; font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:700; background:rgba(0,0,0,0.68); color:#fff; padding:4px 8px; border-radius:999px; }
  .details-episode-runtime{ position:absolute; bottom:8px; right:8px; font-family:'JetBrains Mono',monospace; font-size:10px; background:rgba(0,0,0,0.68); color:#fff; padding:3px 7px; border-radius:999px; }
  .details-episode-body{ padding:12px 14px; display:flex; flex-direction:column; gap:7px; flex:1; }
  .details-episode-title{ font-family:'Inter',sans-serif; font-weight:600; font-size:14px; color:var(--text); line-height:1.3; }
  .details-episode-overview{ font-size:12.5px; color:var(--muted); line-height:1.5; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; min-height:19px; }
  .details-episode-meta{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--muted); }
  .details-episode-foot{ display:flex; align-items:center; gap:10px; margin-top:6px; font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--muted); }
  .details-episode-foot span{ display:inline-flex; align-items:center; gap:5px; padding:4px 8px; border-radius:999px; background:var(--panel-raised); border:1px solid var(--line); }
  .details-episode-foot .likes{ color:var(--crimson); } .details-episode-foot .comments{ color:var(--teal); }

  /* Drawer episodio + commenti */
  .details-drawer{ margin-top:18px; background:var(--panel-raised); border:1px solid var(--line); border-radius:calc(var(--radius)+6px); padding:18px; display:none; }
  .details-drawer.open{ display:block; }
  .details-drawer-head{ display:flex; gap:18px; align-items:flex-start; }
  @media(max-width:640px){ .details-drawer-head{ flex-direction:column; } }
  .details-drawer-still{ flex:0 0 260px; width:260px; max-width:100%; aspect-ratio:16/9; border-radius:10px; overflow:hidden; background:var(--panel); border:1px solid var(--line); }
  .details-drawer-still img{ width:100%; height:100%; object-fit:cover; display:block; }
  .details-drawer-still.empty{ display:flex; align-items:center; justify-content:center; font-size:32px; color:var(--muted); }
  .details-drawer-info{ flex:1 1 auto; min-width:0; }
  .details-drawer-info h3{ font-family:'Inter',sans-serif; font-weight:700; font-size:18px; margin:0 0 6px; color:var(--text); line-height:1.2; }
  .details-drawer-kicker{ font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.5px; color:var(--orange); margin-bottom:6px; }
  .details-drawer-overview{ font-size:13.5px; color:var(--muted); line-height:1.6; margin:0; }
  .details-drawer-actions{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:14px; }
  .details-drawer-like{ display:inline-flex; align-items:center; gap:8px; padding:8px 16px; border-radius:999px; border:1px solid var(--line); background:var(--panel); cursor:pointer; font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:700; color:var(--text); transition:border-color 0.15s, background 0.15s, color 0.15s, transform 0.1s; }
  .details-drawer-like:hover{ border-color:var(--crimson); transform:translateY(-1px); }
  .details-drawer-like.liked{ background:rgba(var(--crimson-rgb),0.14); border-color:var(--crimson); color:var(--crimson); }
  .details-drawer-like:disabled{ opacity:0.6; cursor:wait; }
  .details-drawer-close{ margin-left:auto; background:transparent; border:1px solid var(--line); color:var(--muted); width:32px; height:32px; border-radius:50%; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .details-drawer-close:hover{ border-color:var(--orange); color:var(--orange); }
  .details-comments{ margin-top:18px; border-top:1px dashed var(--line); padding-top:18px; }
  .details-comments h4{ font-family:'Inter',sans-serif; font-weight:700; font-size:13px; color:var(--text); margin:0 0 12px; display:flex; align-items:center; gap:8px; }
  .details-comments h4 small{ font-weight:400; font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--muted); }
  .details-comment-form{ display:flex; gap:10px; align-items:flex-end; }
  .details-comment-form textarea{ flex:1 1 auto; min-height:46px; max-height:120px; resize:vertical; background:var(--panel); border:1px solid var(--line); border-radius:10px; color:var(--text); padding:11px 12px; font-family:'Inter',sans-serif; font-size:13.5px; outline:none; }
  .details-comment-form textarea:focus{ border-color:var(--orange); box-shadow:0 0 0 1px var(--orange); }
  .details-comment-form button{ padding:11px 18px; border-radius:999px; border:none; background:var(--orange); color:#FCEFE6; font-family:'JetBrains Mono',monospace; font-weight:700; font-size:12px; cursor:pointer; white-space:nowrap; }
  .details-comment-form button:disabled{ opacity:0.6; cursor:wait; }
  .details-comments-list{ margin-top:14px; display:flex; flex-direction:column; gap:10px; max-height:380px; overflow-y:auto; padding-right:4px; scrollbar-width:thin; scrollbar-color:var(--orange-dim) transparent; }
  .details-comments-list::-webkit-scrollbar{ width:6px; }
  .details-comments-list::-webkit-scrollbar-thumb{ background:var(--orange-dim); border-radius:999px; }
  .details-comment{ background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:11px 12px; }
  .details-comment-head{ display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  .details-comment-author{ font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:700; color:var(--orange); }
  .details-comment-date{ font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--muted); margin-left:auto; }
  .details-comment-body{ font-size:13.5px; color:var(--text); line-height:1.5; word-break:break-word; white-space:pre-wrap; }
  .details-comment-delete{ background:none; border:none; color:var(--muted); cursor:pointer; font-size:12px; padding:0 4px; }
  .details-comment-delete:hover{ color:var(--crimson); }
  .details-comments-empty{ color:var(--muted); font-family:'JetBrains Mono',monospace; font-size:12px; text-align:center; padding:14px; border:1px dashed var(--line); border-radius:10px; background:var(--panel); }
</style>
</head>
<body>
<div class="wrap">
  <div class="session-bar">
    <div class="session-identity">
      <label class="avatar-upload" id="avatarUpload" title="Cambia foto profilo">
        <img class="avatar-img" id="avatarImg" alt="">
        <span class="avatar-initial" id="avatarInitial"></span>
        <input type="file" accept="image/*" id="avatarInput" hidden>
      </label>
      <a href="profilo.html" class="profile-link"><strong id="sessionUserName"></strong></a>
    </div>
    <button class="btn ghost" id="btnLogout">Esci</button>
  </div>

  <div class="details-page-header">
    <a href="homepage.html" class="back-arrow" title="Torna alla videoteca" aria-label="Torna alla videoteca">←</a>
  </div>

  <div class="details-layout">
    <div class="details-preview-card" id="detailsPreviewCard"></div>
    <div class="details-info" id="detailsInfo"></div>
  </div>

  <!-- Grafico statistiche -->
  <div class="details-stats" id="detailsStats" style="display:none;">
    <div class="details-stats-head">
      <h2>Attività community <span id="statsSeasonLabel"></span></h2>
      <div class="details-stat-pills">
        <span class="details-stat-pill likes">♥ <strong id="statsTotalLikes">0</strong> like</span>
        <span class="details-stat-pill comments">💬 <strong id="statsTotalComments">0</strong> commenti</span>
      </div>
    </div>
    <div class="details-chart-wrap" id="statsChartWrap">
      <svg class="details-chart-svg" id="statsChart" viewBox="0 0 800 200" preserveAspectRatio="none"></svg>
      <div class="details-chart-empty" id="statsChartEmpty" style="display:none;">Nessuna attività per questa stagione — sii il primo a commentare!</div>
    </div>
    <div class="details-chart-legend"><span><i style="background:var(--crimson)"></i> Like</span><span><i style="background:var(--teal)"></i> Commenti</span></div>
  </div>

  <!-- Stagioni / episodi -->
  <div class="details-seasons" id="seasonsSection" style="display:none;">
    <div class="details-seasons-head">
      <h2 id="seasonsTitle">Stagioni</h2>
      <small id="seasonsMeta"></small>
    </div>
    <div class="details-season-layout">
      <div class="details-season-nav" id="seasonNav"></div>
      <div class="details-episodes-wrap">
        <div class="details-episodes-grid" id="seasonEpisodesGrid"></div>
        <!-- Drawer episodio selezionato -->
        <div class="details-drawer" id="episodeDrawer">
          <div class="details-drawer-head">
            <div class="details-drawer-still" id="drawerStill"></div>
            <div class="details-drawer-info">
              <div class="details-drawer-kicker" id="drawerKicker"></div>
              <h3 id="drawerTitle"></h3>
              <p class="details-drawer-overview" id="drawerOverview"></p>
              <div class="details-drawer-actions">
                <button type="button" class="details-drawer-like" id="drawerLikeBtn">♡ <span id="drawerLikeCount">0</span> like</button>
                <span class="details-stat-pill comments" style="border:none; background:transparent; padding:0;"><span id="drawerCommentCount">0</span> commenti</span>
                <button type="button" class="details-drawer-close" id="drawerClose" title="Chiudi">✕</button>
              </div>
            </div>
          </div>
          <div class="details-comments">
            <h4>Commenti sull'episodio <small id="drawerEpisodeLabel"></small></h4>
            <form class="details-comment-form" id="commentForm">
              <textarea id="commentInput" placeholder="Scrivi un commento su questo episodio…" maxlength="500" rows="2"></textarea>
              <button type="submit" id="commentSubmit">Invia</button>
            </form>
            <div class="details-comments-list" id="commentsList"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Fallback per film (single episode) verrà gestito mostrando la stessa sezione -->
</div>

<script src="config.js"></script>
<script>
(function () {
  const authUser = getStoredUsername();
  const sessionUserName = document.getElementById('sessionUserName');
  if (sessionUserName) sessionUserName.textContent = authUser || '';
  document.getElementById('btnLogout').onclick = () => redirectToLogin();

  const avatarImg = document.getElementById('avatarImg');
  const avatarInitial = document.getElementById('avatarInitial');
  const avatarInput = document.getElementById('avatarInput');
  function displayAvatar(dataUrl, usernameForInitial){
    if(dataUrl){ avatarImg.src=dataUrl; avatarImg.style.display='block'; avatarInitial.style.display='none'; }
    else{ avatarImg.style.display='none'; avatarInitial.style.display='flex'; avatarInitial.textContent=(usernameForInitial||'?').trim().charAt(0).toUpperCase(); }
  }
  async function loadAccountInfo(){
    try{
      const me = await apiFetch('/me');
      if(me && me.username && sessionUserName) sessionUserName.textContent = me.username;
      displayAvatar(me ? me.avatar : null, me ? me.username : authUser);
    }catch(e){ if(e.status===401){ redirectToLogin(); return; } displayAvatar(null, authUser); }
  }
  loadAccountInfo();
  if(avatarInput) avatarInput.onchange = () => {
    const file = avatarInput.files && avatarInput.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      const img=new Image();
      img.onload=()=>{
        const size=160; const canvas=document.createElement('canvas'); canvas.width=size; canvas.height=size;
        const ctx=canvas.getContext('2d'); const scale=Math.max(size/img.width,size/img.height); const w=img.width*scale,h=img.height*scale;
        ctx.drawImage(img,(size-w)/2,(size-h)/2,w,h);
        const dataUrl=canvas.toDataURL('image/jpeg',0.85);
        apiFetch('/me/avatar',{method:'PUT',body:JSON.stringify({avatar:dataUrl})}).then(()=>displayAvatar(dataUrl,authUser)).catch(err=>showNotice('Non sono riuscito a salvare la foto: '+err.message));
      }; img.src=e.target.result;
    }; reader.readAsDataURL(file); avatarInput.value='';
  };

  const params = new URLSearchParams(window.location.search);
  const tmdbId = params.get('id');
  const mediaType = params.get('type') === 'movie' ? 'movie' : 'tv';
  const previewCard = document.getElementById('detailsPreviewCard');
  const infoEl = document.getElementById('detailsInfo');
  const statsSection = document.getElementById('detailsStats');
  const statsChart = document.getElementById('statsChart');
  const statsChartEmpty = document.getElementById('statsChartEmpty');
  const statsChartWrap = document.getElementById('statsChartWrap');
  const statsTotalLikes = document.getElementById('statsTotalLikes');
  const statsTotalComments = document.getElementById('statsTotalComments');
  const statsSeasonLabel = document.getElementById('statsSeasonLabel');

  if(!tmdbId){
    infoEl.innerHTML='<div class="details-empty">Titolo non valido. Torna alla videoteca e riprova.</div>';
    return;
  }

  let shows=[];
  async function loadShows(){ try{ const data=await apiFetch('/shows'); shows=Array.isArray(data)?data:[]; }catch(e){ if(e.status===401){redirectToLogin();return;} shows=[]; } }
  function saveShows(){ apiFetch('/shows',{method:'PUT',body:JSON.stringify(shows)}).catch(e=>{ if(e.status===401){redirectToLogin();return;} showNotice('Non sono riuscito a salvare i dati sul server.'); }); }
  const wantedType = mediaType==='movie'?'film':'serie';
  function findInShelf(){ return shows.find(s=> s.tmdbId===Number(tmdbId) && s.type===wantedType) || null; }
  function getPrevNextEpisode(show){
    let prev=null,next=null;
    for(let si=0; si<show.seasons.length; si++){
      const se=show.seasons[si];
      for(let ei=0; ei<se.watched.length; ei++){
        if(se.watched[ei]) prev={season:si+1,episode:ei+1};
        else if(!next) next={season:si+1,episode:ei+1};
      }
    }
    return {prev,next};
  }

  const seasonEpisodesCache=new Map();
  function getSeasonEpisodeList(season){
    if(seasonEpisodesCache.has(season)) return seasonEpisodesCache.get(season);
    const p=apiFetch('/catalog/episodes?tvId='+encodeURIComponent(tmdbId)+'&season='+season).catch(()=>{ seasonEpisodesCache.delete(season); return null; });
    seasonEpisodesCache.set(season,p); return p;
  }

  // Stats social
  let socialStats=null; // {totalLikes, totalComments, perEpisode, perSeason}
  let selectedSeason=1;
  let selectedEpisode=null; // {season, episode, data}

  async function loadSocialStats(){
    try{
      socialStats=await apiFetch('/episode-social/stats?tmdbId='+encodeURIComponent(tmdbId)+'&mediaType='+encodeURIComponent(mediaType));
    }catch(e){ socialStats={totalLikes:0,totalComments:0,perEpisode:[],perSeason:[]}; }
  }
  function statsForEpisode(season, episode){
    if(!socialStats || !socialStats.perEpisode) return {likes:0,comments:0};
    const f=socialStats.perEpisode.find(x=> x.season===season && x.episode===episode);
    return f ? {likes:f.likes, comments:f.comments} : {likes:0, comments:0};
  }

  function renderStatsChart(){
    if(!socialStats){ statsSection.style.display='none'; return; }
    statsSection.style.display='block';
    // Per TV: mostra la stagione selezionata, per film mostra unico punto
    let items=[];
    let maxVal=1;
    let label='';
    if(mediaType==='movie'){
      const s=statsForEpisode(0,1);
      items=[{label:'Film', likes:s.likes, comments:s.comments}];
      label='Film';
      maxVal=Math.max(1, s.likes, s.comments);
      statsTotalLikes.textContent=String(socialStats.totalLikes||0);
      statsTotalComments.textContent=String(socialStats.totalComments||0);
    } else {
      // Filtra per selectedSeason
      const filtered=socialStats.perEpisode.filter(x=> x.season===selectedSeason);
      // Se non ci sono dati social, dobbiamo comunque mostrare zero per ogni episodio della stagione (per avere barre vuote)
      // Recupera count episodi da cache? Usa detailsCache + episode list length
      let epCount = detailsCache && detailsCache.numberOfSeasons ? null : null;
      // Se non abbiamo filtered, prova a costruire items con likes 0 usando la lista episodi
      if(filtered.length===0){
        // Prova a dedurre numero episodi dalla lista in cache (se disponibile)
        // Se non disponibile, mostra empty
        const listPromise = seasonEpisodesCache.get(selectedSeason);
        // Se non abbiamo ancora caricato la lista, posticipa rendering del grafico dopo il load
      }
      // Costruisci items per ogni episodio della stagione selezionata
      // Per avere max corretto, meglio aspettare che la lista episodi sia disponibile
      // Se ancora non disponibile, usa solo i dati social (potrebbe essere vuoto)
      if(filtered.length>0){
        items=filtered.map(x=> ({label:'E'+x.episode, likes:x.likes, comments:x.comments, ep:x.episode})).sort((a,b)=>a.ep-b.ep);
        maxVal=Math.max(1, ...items.map(i=> Math.max(i.likes,i.comments)));
        label='Stagione '+selectedSeason;
      } else {
        // Nessun dato per questa stagione — mostra comunque la struttura vuota ma leggibile
        items=[];
        label='Stagione '+selectedSeason;
      }
      const seasonSummary = socialStats.perSeason.find(x=> x.season===selectedSeason);
      // totali complessivi
      statsTotalLikes.textContent=String(socialStats.totalLikes||0);
      statsTotalComments.textContent=String(socialStats.totalComments||0);
      // Se seasonSummary esiste, potremmo mostrare dettaglio stagione? Usiamo totali globali + label stagione
    }
    statsSeasonLabel.textContent=label;

    if(mediaType==='tv' && items.length===0){
      // Costruisci barre vuote basate sul numero reale di episodi (per non mostrare vuoto ingannevole)
      (async ()=>{
        const list = await getSeasonEpisodeList(selectedSeason);
        if(!list || !list.length){
          // Nessun episodio — mostra empty
          statsChart.style.display='none';
          statsChartEmpty.style.display='block';
          statsChartEmpty.textContent='Nessun episodio trovato per questa stagione.';
          return;
        }
        const zeroItems=list.map(ep=> ({label:'E'+ep.episodeNumber, likes:0, comments:0, ep:ep.episodeNumber}));
        // Sovrascrivi con dati social se presenti
        zeroItems.forEach(it=>{
          const found=socialStats.perEpisode.find(x=> x.season===selectedSeason && x.episode===it.ep);
          if(found){ it.likes=found.likes; it.comments=found.comments; }
        });
        const hasAny = zeroItems.some(i=> i.likes>0 || i.comments>0);
        if(!hasAny){
          statsChart.style.display='none';
          statsChartEmpty.style.display='block';
          // Disegna comunque barre a zero per dare contesto? Mostriamo empty con suggerimento
          return;
        }
        drawChart(zeroItems);
      })();
      return;
    }

    if(items.length===0){
      statsChart.style.display='none';
      statsChartEmpty.style.display='block';
      return;
    }
    statsChartEmpty.style.display='none';
    statsChart.style.display='block';
    drawChart(items);
  }

  function drawChart(items){
    const W=800, H=200, padL=36, padR=12, padT=16, padB=28;
    const chartW=W-padL-padR, chartH=H-padT-padB;
    const n=items.length;
    const groupW=chartW / n;
    const barGap=4;
    const barW=Math.max(8, Math.min(32, (groupW - barGap*3)/2 ));
    const maxVal=Math.max(1, ...items.map(i=> Math.max(i.likes,i.comments,1)));
    // Scala
    const scale=v=> (v/maxVal)*chartH;
    let svg='';
    // Griglia orizzontale
    const ticks=4;
    for(let t=0; t<=ticks; t++){
      const y=padT + (chartH * t / ticks);
      const val=Math.round(maxVal * (1 - t/ticks));
      svg+=`<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>`;
      svg+=`<text x="${padL-8}" y="${y+4}" text-anchor="end" font-family="JetBrains Mono,monospace" font-size="10" fill="var(--muted)">${val}</text>`;
    }
    items.forEach((it, idx)=>{
      const gx=padL + idx*groupW + (groupW - (barW*2+barGap))/2;
      const hLikes=scale(it.likes);
      const hComments=scale(it.comments);
      const yLikes=padT + chartH - hLikes;
      const yComments=padT + chartH - hComments;
      const xLikes=gx;
      const xComments=gx+barW+barGap;
      svg+=`<rect x="${xLikes}" y="${yLikes}" width="${barW}" height="${hLikes}" rx="4" fill="var(--crimson)" opacity="0.95"/>`;
      svg+=`<rect x="${xComments}" y="${yComments}" width="${barW}" height="${hComments}" rx="4" fill="var(--teal)" opacity="0.95"/>`;
      // Valore sopra barra se >0
      if(it.likes>0) svg+=`<text x="${xLikes+barW/2}" y="${yLikes-6}" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="9" font-weight="700" fill="var(--crimson)">${it.likes}</text>`;
      if(it.comments>0) svg+=`<text x="${xComments+barW/2}" y="${yComments-6}" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="9" font-weight="700" fill="var(--teal)">${it.comments}</text>`;
      // Label episodio
      const labelX=padL + idx*groupW + groupW/2;
      svg+=`<text x="${labelX}" y="${H-8}" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="10" fill="var(--muted)">${escapeHtml(it.label)}</text>`;
    });
    statsChart.innerHTML=svg;
  }

  // Drawer + commenti
  const drawer=document.getElementById('episodeDrawer');
  const drawerStill=document.getElementById('drawerStill');
  const drawerKicker=document.getElementById('drawerKicker');
  const drawerTitle=document.getElementById('drawerTitle');
  const drawerOverview=document.getElementById('drawerOverview');
  const drawerLikeBtn=document.getElementById('drawerLikeBtn');
  const drawerLikeCount=document.getElementById('drawerLikeCount');
  const drawerCommentCount=document.getElementById('drawerCommentCount');
  const drawerEpisodeLabel=document.getElementById('drawerEpisodeLabel');
  const drawerClose=document.getElementById('drawerClose');
  const commentForm=document.getElementById('commentForm');
  const commentInput=document.getElementById('commentInput');
  const commentSubmit=document.getElementById('commentSubmit');
  const commentsList=document.getElementById('commentsList');

  function closeDrawer(){
    drawer.classList.remove('open');
    selectedEpisode=null;
    document.querySelectorAll('.details-episode-card.active').forEach(c=> c.classList.remove('active'));
  }
  drawerClose.onclick=closeDrawer;

  async function openEpisodeDrawer(season, episode, epData){
    selectedEpisode={season, episode, data:epData};
    // Evidenzia card
    document.querySelectorAll('.details-episode-card.active').forEach(c=> c.classList.remove('active'));
    const card=document.querySelector(`.details-episode-card[data-season="${season}"][data-episode="${episode}"]`);
    if(card) card.classList.add('active');

    const name=(epData && epData.name) ? epData.name : ('Episodio '+episode);
    const stillUrl=epData && epData.stillUrl;
    const overview=epData && epData.overview ? epData.overview : 'Nessuna descrizione disponibile per questo episodio.';

    drawerStill.innerHTML= stillUrl ? `<img src="${stillUrl}" alt="" loading="lazy">` : '🎬';
    drawerStill.className = 'details-drawer-still' + (stillUrl ? '' : ' empty');
    drawerKicker.textContent = mediaType==='movie' ? 'Film · '+escapeHtml(detailsCache.title) : `Stagione ${season} · Episodio ${episode}`;
    drawerTitle.textContent=name;
    drawerOverview.textContent=overview;
    drawerEpisodeLabel.textContent= mediaType==='movie' ? 'film' : `S${season} E${episode}`;

    drawer.classList.add('open');
    drawer.scrollIntoView({behavior:'smooth', block:'nearest'});

    // Carica like-status e commenti
    drawerLikeBtn.disabled=true;
    commentsList.innerHTML='<div class="details-comments-empty">Caricamento commenti…</div>';
    try{
      const [status, comments] = await Promise.all([
        apiFetch(`/episode-social/like-status?tmdbId=${encodeURIComponent(tmdbId)}&mediaType=${encodeURIComponent(mediaType)}&season=${season}&episode=${episode}`),
        apiFetch(`/episode-social/comments?tmdbId=${encodeURIComponent(tmdbId)}&mediaType=${encodeURIComponent(mediaType)}&season=${season}&episode=${episode}`)
      ]);
      drawerLikeBtn.disabled=false;
      drawerLikeBtn.classList.toggle('liked', !!status.liked);
      drawerLikeBtn.innerHTML = (status.liked ? '♥' : '♡') + ` <span id="drawerLikeCount">${status.likes}</span> like`;
      // Re-bind count span reference after innerHTML rewrite
      // Aggiorna contatori globali nel drawer
      document.getElementById('drawerLikeCount').textContent=status.likes;
      drawerCommentCount.textContent=status.comments;
      renderComments(comments);
    }catch(e){
      drawerLikeBtn.disabled=false;
      drawerLikeBtn.textContent='♡ 0 like';
      commentsList.innerHTML='<div class="details-comments-empty">'+escapeHtml(e.message||'Errore caricamento commenti.')+'</div>';
    }
  }

  function renderComments(list){
    if(!Array.isArray(list) || list.length===0){
      commentsList.innerHTML='<div class="details-comments-empty">Nessun commento per questo episodio — scrivi il primo!</div>';
      return;
    }
    // Ordina dal più recente
    commentsList.innerHTML='';
    list.forEach(c=>{
      const el=document.createElement('div');
      el.className='details-comment';
      const date=new Date(c.created_at);
      const dateStr = date.toLocaleString('it-IT',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
      const isMine = c.username === authUser;
      el.innerHTML=`
        <div class="details-comment-head">
          <span class="details-comment-author">${escapeHtml(c.username)}</span>
          <span class="details-comment-date">${escapeHtml(dateStr)}</span>
          ${isMine ? `<button class="details-comment-delete" data-id="${c.id}" title="Elimina">✕</button>` : ''}
        </div>
        <div class="details-comment-body">${escapeHtml(c.body)}</div>
      `;
      commentsList.appendChild(el);
    });
    commentsList.querySelectorAll('.details-comment-delete').forEach(btn=>{
      btn.onclick=async()=>{
        const id=btn.dataset.id;
        if(!confirm('Eliminare questo commento?')) return;
        try{
          await apiFetch('/episode-social/comments/'+id, {method:'DELETE'});
          // Ricarica lista
          if(selectedEpisode) openEpisodeDrawer(selectedEpisode.season, selectedEpisode.episode, selectedEpisode.data);
          // Aggiorna stats globali
          await loadSocialStats(); renderStatsChart(); updateEpisodeFootCounts();
        }catch(e){ showNotice(e.message); }
      };
    });
  }

  drawerLikeBtn.onclick = async ()=>{
    if(!selectedEpisode) return;
    drawerLikeBtn.disabled=true;
    try{
      const res=await apiFetch('/episode-social/like',{method:'POST', body:JSON.stringify({tmdbId:Number(tmdbId), mediaType, season:selectedEpisode.season, episode:selectedEpisode.episode})});
      drawerLikeBtn.classList.toggle('liked', !!res.liked);
      drawerLikeBtn.innerHTML=(res.liked ? '♥' : '♡')+` <span id="drawerLikeCount">${res.likes}</span> like`;
      drawerCommentCount.textContent = drawerCommentCount.textContent; // keep
      await loadSocialStats(); renderStatsChart(); updateEpisodeFootCounts();
    }catch(e){ showNotice(e.message); }
    drawerLikeBtn.disabled=false;
  };

  commentForm.addEventListener('submit', async (e)=>{
    e.preventDefault();
    if(!selectedEpisode) return;
    const text=commentInput.value.trim();
    if(text.length<2){ showNotice('Scrivi almeno 2 caratteri.'); return; }
    if(text.length>500){ showNotice('Max 500 caratteri.'); return; }
    commentSubmit.disabled=true; commentSubmit.textContent='Invio…';
    try{
      await apiFetch('/episode-social/comments',{method:'POST', body:JSON.stringify({tmdbId:Number(tmdbId), mediaType, season:selectedEpisode.season, episode:selectedEpisode.episode, body:text})});
      commentInput.value='';
      // Ricarica commenti e stats
      const comments=await apiFetch(`/episode-social/comments?tmdbId=${encodeURIComponent(tmdbId)}&mediaType=${encodeURIComponent(mediaType)}&season=${selectedEpisode.season}&episode=${selectedEpisode.episode}`);
      renderComments(comments);
      // Aggiorna contatore e stats
      const status=await apiFetch(`/episode-social/like-status?tmdbId=${encodeURIComponent(tmdbId)}&mediaType=${encodeURIComponent(mediaType)}&season=${selectedEpisode.season}&episode=${selectedEpisode.episode}`);
      drawerCommentCount.textContent=status.comments;
      document.getElementById('drawerLikeCount').textContent=status.likes;
      await loadSocialStats(); renderStatsChart(); updateEpisodeFootCounts();
    }catch(err){ showNotice(err.message); }
    commentSubmit.disabled=false; commentSubmit.textContent='Invia';
  });

  function updateEpisodeFootCounts(){
    if(!socialStats || !socialStats.perEpisode) return;
    document.querySelectorAll('.details-episode-card').forEach(card=>{
      const s=parseInt(card.dataset.season,10), ep=parseInt(card.dataset.episode,10);
      const st=statsForEpisode(s,ep);
      const likesEl=card.querySelector('.ep-likes'); const commentsEl=card.querySelector('.ep-comments');
      if(likesEl) likesEl.textContent=st.likes;
      if(commentsEl) commentsEl.textContent=st.comments;
    });
  }

  async function renderSeasonEpisodeList(season){
    const grid=document.getElementById('seasonEpisodesGrid');
    grid.innerHTML='<div class="details-empty">Caricamento episodi…</div>';
    const list=await getSeasonEpisodeList(season);
    if(!list || list.length===0){
      grid.innerHTML='<div class="details-empty">Nessun episodio trovato per questa stagione.</div>';
      return;
    }
    grid.innerHTML='';
    const sorted=[...list].sort((a,b)=> a.episodeNumber - b.episodeNumber);
    sorted.forEach(ep=>{
      grid.appendChild(buildEpisodeCard(season, ep));
    });
    updateEpisodeFootCounts();
    // Se un episodio era selezionato ma non appartiene a questa stagione, chiudi drawer
    if(selectedEpisode && selectedEpisode.season!==season) closeDrawer();
    renderStatsChart();
  }

  function buildEpisodeCard(season, epData){
    const card=document.createElement('div');
    card.className='details-episode-card';
    card.dataset.season=season; card.dataset.episode=epData.episodeNumber;
    const st=statsForEpisode(season, epData.episodeNumber);
    const name=(epData.name && epData.name.trim()) ? epData.name.trim() : ('Episodio '+epData.episodeNumber);
    const runtime=epData.runtime ? epData.runtime+' min' : '';
    const airDate=epData.airDate ? new Date(epData.airDate).toLocaleDateString('it-IT',{day:'2-digit',month:'short',year:'numeric'}) : '';
    const stillUrl=epData.stillUrl;
    card.innerHTML=`
      <div class="details-episode-still">${stillUrl ? `<img src="${stillUrl}" alt="" loading="lazy">` : '🎞️'}<span class="details-episode-badge">E${epData.episodeNumber}</span>${runtime ? `<span class="details-episode-runtime">⏱ ${escapeHtml(runtime)}</span>`:''}</div>
      <div class="details-episode-body">
        <div class="details-episode-title">${escapeHtml(name)}</div>
        ${epData.overview ? `<div class="details-episode-overview">${escapeHtml(epData.overview)}</div>` : `<div class="details-episode-overview" style="opacity:0.6">Nessuna descrizione.</div>`}
        <div class="details-episode-meta">${airDate? `<span>📅 ${escapeHtml(airDate)}</span>`:''}${epData.voteAverage? `<span>★ ${epData.voteAverage} TMDB</span>`:''}</div>
        <div class="details-episode-foot"><span class="likes">♥ <b class="ep-likes">${st.likes}</b></span><span class="comments">💬 <b class="ep-comments">${st.comments}</b></span><span style="margin-left:auto; font-size:10px;">Apri →</span></div>
      </div>
    `;
    card.onclick=()=> openEpisodeDrawer(season, epData.episodeNumber, epData);
    return card;
  }

  function renderSeasonNav(totalSeasons, defaultSeason){
    const nav=document.getElementById('seasonNav');
    nav.innerHTML='';
    for(let s=1; s<=totalSeasons; s++){
      const btn=document.createElement('button');
      btn.type='button';
      const isActive=s===defaultSeason;
      btn.className='details-season-tab'+(isActive?' active':'');
      // Mostra conteggio episodi se noto: prova a dedurre da detailsCache seasons? Altrimenti TBD
      let epCount=null;
      if(detailsCache && detailsCache.seasonsMeta && detailsCache.seasonsMeta[s]) epCount=detailsCache.seasonsMeta[s];
      btn.innerHTML=`<span>Stagione ${s}</span>${epCount? `<small>${epCount} ep</small>`:''}`;
      btn.onclick=()=>{
        selectedSeason=s;
        nav.querySelectorAll('.details-season-tab').forEach(b=> b.classList.remove('active'));
        btn.classList.add('active');
        renderSeasonEpisodeList(s);
      };
      nav.appendChild(btn);
    }
    // Aggiorna label seasons
    document.getElementById('seasonsTitle').textContent='Episodi';
    document.getElementById('seasonsMeta').textContent= totalSeasons + (totalSeasons===1 ? ' stagione' : ' stagioni');
  }

  function renderAddButton(details){
    const existing=findInShelf();
    const btn=document.createElement('button');
    btn.type='button'; btn.className='details-add-btn'+(existing?' added':'');
    btn.textContent= existing ? '✓ Nella videoteca' : '+ Aggiungi allo scaffale';
    btn.onclick=async()=>{
      const cur=findInShelf();
      if(cur){
        shows=shows.filter(s=> s.id!==cur.id); saveShows();
        btn.className='details-add-btn'; btn.textContent='+ Aggiungi allo scaffale';
        showNotice(`"${cur.title}" rimosso dallo scaffale.`); return;
      }
      btn.disabled=true; btn.textContent='Attendere…';
      let addDetails;
      try{ addDetails=await apiFetch('/catalog/details?id='+tmdbId+'&type='+mediaType); }
      catch(e){ if(e.status===401){redirectToLogin();return;} showNotice('Impossibile recuperare i dettagli: '+e.message); btn.disabled=false; btn.textContent='+ Aggiungi allo scaffale'; return; }
      shows.unshift({ id:uid(), title:addDetails.title, type:addDetails.type, rating:0, favorite:false, episodeRuntime:addDetails.episodeRuntime||null, posterUrl:addDetails.posterUrl||details.posterUrl||null, backdropUrl:addDetails.backdropUrl||null, tmdbId:Number(tmdbId), lastModifiedAt:Date.now(), seasons:addDetails.seasons });
      saveShows(); btn.disabled=false; btn.className='details-add-btn added'; btn.textContent='✓ Nella videoteca'; showNotice('"'+addDetails.title+'" aggiunto alla videoteca.');
    };
    return btn;
  }

  let detailsCache=null;
  async function init(){
    infoEl.innerHTML='<div class="details-empty">Caricamento…</div>';
    await loadShows();
    await loadSocialStats();
    let details;
    try{ details=await apiFetch('/catalog/full-details?id='+tmdbId+'&type='+mediaType); }
    catch(e){ if(e.status===401){redirectToLogin();return;} infoEl.innerHTML='<div class="details-empty">'+escapeHtml(e.message||'Errore durante il caricamento.')+'</div>'; return; }
    detailsCache=details;
    // Mappa per conteggio episodi per stagione (per nav)
    if(mediaType==='tv' && detailsCache.numberOfSeasons){
      detailsCache.seasonsMeta={};
      // Prova a popolare con chiamata episodes per ogni stagione in background? Per ora lascia null, verrà aggiornato lazy
    }
    document.title=details.title+' — Videoteca';
    const previewImage=details.posterUrl||details.backdropUrl;
    if(previewImage) previewCard.style.backgroundImage=`url("${previewImage}")`;
    const runtimeLabel= mediaType==='movie' ? (details.runtime? `${details.runtime} min`:null) : (details.episodeRuntime? `${details.episodeRuntime} min/ep`:null);
    infoEl.innerHTML=`
      <h1>${escapeHtml(details.title)}</h1>
      <div class="details-meta-row">
        ${details.year? `<span class="runtime-badge">${escapeHtml(details.year)}</span>`:''}
        ${runtimeLabel? `<span class="runtime-badge">⏱ ${escapeHtml(runtimeLabel)}</span>`:''}
        ${mediaType==='tv' && details.status? `<span class="status-badge">${escapeHtml(details.status)}</span>`:''}
        ${mediaType==='tv' && details.numberOfSeasons? `<span class="status-badge">${details.numberOfSeasons} ${details.numberOfSeasons===1?'stagione':'stagioni'}</span>`:''}
        ${details.rating? `<span class="status-badge">★ ${details.rating} TMDB${details.voteCount? ' ('+details.voteCount+' voti)':''}</span>`:''}
      </div>
      ${details.genres && details.genres.length? `<div class="details-genres">${details.genres.map(g=> `<span class="details-genre-chip">${escapeHtml(g)}</span>`).join('')}</div>`:''}
      ${details.overview? `<p class="details-overview">${escapeHtml(details.overview)}</p>`:''}
    `;
    infoEl.appendChild(renderAddButton(details));
    renderStatsChart();

    if(mediaType==='tv'){
      const section=document.getElementById('seasonsSection');
      section.style.display='block';
      const totalSeasons=detailsCache.numberOfSeasons||1;
      let defaultSeason=1;
      const existing=findInShelf();
      if(existing){ const {prev,next}=getPrevNextEpisode(existing); defaultSeason=(next||prev||{season:1}).season; }
      selectedSeason=defaultSeason;
      renderSeasonNav(totalSeasons, defaultSeason);
      renderSeasonEpisodeList(defaultSeason);
      // Popola meta episodi per stagione in background (per badge nav)
      if(totalSeasons<=12){
        for(let s=1; s<=totalSeasons; s++){
          getSeasonEpisodeList(s).then(list=>{
            if(list && list.length){
              const btn=document.querySelector(`.details-season-tab:nth-child(${s}) small`);
              // Aggiorna se esiste placeholder altrimenti crea
              const tab=document.querySelectorAll('.details-season-tab')[s-1];
              if(tab && !tab.querySelector('small')){
                const sm=document.createElement('small'); sm.textContent=list.length+' ep'; tab.appendChild(sm);
              } else if(tab){
                tab.querySelector('small').textContent=list.length+' ep';
              }
            }
          });
        }
      }
    } else {
      // Film: mostra stagione fittizia ma con stessa UI semplificata
      const section=document.getElementById('seasonsSection');
      section.style.display='block';
      document.getElementById('seasonsTitle').textContent='Film';
      document.getElementById('seasonsMeta').textContent='1 titolo';
      const nav=document.getElementById('seasonNav');
      nav.innerHTML='';
      // Nasconde nav per film, ma lascia placeholder per coerenza
      nav.style.display='none';
      selectedSeason=0;
      // Crea card film come fosse episodio 1
      const grid=document.getElementById('seasonEpisodesGrid');
      grid.innerHTML='';
      const fakeEp={episodeNumber:1, name:details.title, overview:details.overview||'', stillUrl:details.backdropUrl||details.posterUrl||null, runtime:details.runtime||null, airDate:details.year||'', voteAverage:details.rating||null};
      grid.appendChild(buildEpisodeCard(0, fakeEp));
      updateEpisodeFootCounts();
      // Per film il grafico è già renderizzato
    }
  }
  init();
})();
</script>
